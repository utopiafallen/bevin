<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bevin — setup</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/config-forms.css">
<script>
  (function(){try{var t=localStorage.getItem("bevin-theme");
    if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
    document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<script src="/config-forms.js"></script>
<style>
  /* page chrome for the first-time setup wizard (the shared form
  styles live in config-forms.css, loaded above) */
  /* wizard layout, on top of brand.css (Nunito + warm tokens) */
  body { max-width: 920px; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }
  .setup-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin: .3rem 0 0; }
  .steps { display:flex; gap:.4rem; flex-wrap:wrap; margin: 1.1rem 0 .4rem; }
  .step { padding:.2rem .7rem; border:1px solid var(--border); border-radius:999px; font-size:.8rem; font-weight:700; color:var(--text-muted); background:var(--surface); }
  .step.done { color:var(--brand-strong); border-color:var(--brand-soft); background:var(--brand-softer); }
  .step.active { background:var(--brand); color:var(--brand-contrast); border-color:transparent; }
  .card { margin-top: 1rem; }
  .model { border:1px dashed var(--border); border-radius:var(--radius); padding:.6rem .85rem; margin-top:.8rem; background:var(--surface-2); }
  pre.kv { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:.8rem; overflow:auto; margin:0; }
  /* sidecars step (display-only) — per-sidecar progress + a confirmation banner */
  .sidecar-list { margin-top:.9rem; display:flex; flex-direction:column; gap:.55rem; }
  .sidecar-row { display:flex; gap:.6rem; align-items:flex-start; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:.6rem .7rem; }
  .sidecar-icon { width:1.1rem; text-align:center; font-weight:800; margin-top:.1rem; color:var(--text-muted); flex:none; }
  .sidecar-icon.ready { color:var(--ok); }
  .sidecar-icon.error { color:var(--danger); }
  .sidecar-icon.downloading, .sidecar-icon.starting { color:var(--brand-strong); animation:sidecarPulse 1.2s ease-in-out infinite; }
  @keyframes sidecarPulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .sidecar-body { flex:1; min-width:0; }
  .sidecar-head { display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
  .sidecar-name { font-weight:700; font-size:.9rem; }
  .sidecar-desc { font-size:.78rem; color:var(--text-muted); }
  .sidecar-msg { font-size:.78rem; color:var(--text-muted); margin-top:.2rem; word-break:break-word; }
  .sidecar-bar { height:6px; background:var(--border); border-radius:4px; margin-top:.4rem; overflow:hidden; }
  .sidecar-fill { height:100%; width:0; background:var(--brand); border-radius:4px; transition:width .4s ease; }
  .sidecar-fill.ready { background:var(--ok); }
  .sidecar-fill.error { background:var(--danger); }
  .sidecar-banner { margin-top:.9rem; font-size:.88rem; font-weight:600; padding:.6rem .8rem; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-2); }
  .sidecar-banner.ok { color:var(--ok); border-color:var(--ok); }
  .sidecar-banner.err { color:var(--danger); border-color:var(--danger); }
  .sidecar-retry { font:inherit; font-weight:700; margin-left:.5rem; padding:.2rem .6rem; border:1px solid var(--danger); border-radius:var(--radius); background:transparent; color:var(--danger); cursor:pointer; }
  /* slider — the fill's right edge must land on the thumb center. Two non-obvious
     resets, both of which used to break alignment in real browsers:
     (1) padding:0 — the global `input` rule sets padding:0.6rem 0.85rem, so the
         thumb otherwise travels on the narrower CONTENT box (inset ~13.6px) while
         the fill gradient spans the full border box, giving a value-dependent
         offset (fill short at low, long at high).
     (2) no border (box-shadow inset for the visual border) — a real 1px border
         (border-box) shifts the gradient's 100% vs the thumb's travel range by 2px.
     With padding:0 + no border, the thumb (18px, box-sizing:border-box) travels the
     full clientWidth, so the JS-computed fill position (see scoreFill) lands on the
     thumb center at every value + width. */
</style>

</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
  <svg class="ico-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>
<div>
  <a class="brand" href="/setup"><img src="/logo-mark.svg" alt="bevin logo"> bevin</a>
  <div class="setup-title">First-time setup</div>
</div>
<p class="small">plain HTTP — put a reverse proxy in front for TLS &middot; Setup is token-gated and in-memory; nothing is written until you finish.</p>
<div class="steps" id="steps"></div>

<div class="card">
  <div id="body"></div>
</div>

<div class="btns">
  <button id="back">Back</button>
  <button id="next" class="primary">Next</button>

  <button id="cancel" class="ghost">Cancel</button>
</div>
<div class="msg" id="msg"></div>

<script>
const STEPS = {{.Steps | jsonify}};
const SERVER = {{.Server | jsonify}};
let idx = 0;
// Endpoint constants for the shared form components (config-forms.js): the
// model Detect probe + the draft test-email send. The admin config pages
// define the same names pointing at their own /admin/api/* endpoints.
const PROBE_URL = "/setup/probe-model";
const EMAIL_TEST_URL = "/setup/test-email";
let S = { admin: {handle:"",display_name:"",password:""}, oauth: {enabled:false, name:"", client_id:"", client_secret:"", auth_url:"", token_url:"", userinfo_url:"", scopes:"", base_uri:""}, models: [], modelDraft: {provider:"",base_url:"",api_key:"",model_id:"",display_name:"",max_context:"",context_auto:false,metadata:{reasoning:5,knowledge:5,speed:5},slots:1,enabled:true,auto_disabled:false,lockedTo:null}, editingIndex: -1, editOriginal: null, formError: null, aux: [], sidecars: {qdrant:"",llama_server:"",ffmpeg:""}, auxError: {}, sidecarStatus: null, email: {enabled:false, smtp_host:"", smtp_port:"", username:"", password:"", from_address:"", from_name:"", use_starttls:true} };

// ---- per-step renderers ----
function renderServer(){ return el("div",{},
  el("h3",{}, "1. Server"),
  el("p",{}, "Review the server basics (set via CLI flags; not editable here)."),
  field("Data dir", el("span",{class:"kv"},SERVER.dataDir)),
  field("Bind / port", el("span",{class:"kv"},SERVER.bind + " : " + SERVER.port + " (CLI)"))
);}
function renderAdmin(){ const a=S.admin; return el("div",{},
  el("h3",{}, "2. Identity & admin"),
  el("p",{class:"small"},"The admin account is the server's own IdP (no external login). It is the only account that can create users."),
  field("Handle", inp("ad_handle", a.handle, "admin")),
  field("Display name", inp("ad_name", a.display_name, "Administrator")),
  el("div",{class:"row"},
    pwfield("Password", "ad_pw", a.password, "min 8 chars"),
    pwfield("Confirm", "ad_pw2", a.password, ""))
);}
function renderOAuth(){
  const o = S.oauth;
  const d = el("div",{});
  d.append(el("h3",{}, "3. External sign-in (OAuth) — optional"));
  d.append(el("p",{class:"small"},"Add an external identity provider (authentik, Keycloak, Google — anything with an authorization-code + user-info flow) ALONGSIDE bevin's own login: the admin account always signs in with its password, and any user you enable in the provider signs in through it — bevin creates their account automatically on first login. Leave it off to skip; you can add it later in the admin dashboard's Users panel."));
  // Enable toggle (Yes/No) — same pattern as the email step.
  const en = el("div",{class:"yesno"});
  const yesB = el("button",{type:"button", class:o.enabled?"sel":""}, "Yes");
  const noB = el("button",{type:"button", class:!o.enabled?"sel":""}, "No");
  yesB.addEventListener("click",()=>{ o.enabled=true; render(); });
  noB.addEventListener("click",()=>{ o.enabled=false; render(); });
  en.append(yesB,noB);
  d.append(field("Enable external sign-in (OAuth)", en));
  if(!o.enabled){
    d.append(el("p",{class:"small"},"OAuth is off — bevin accepts its own logins only. The rest of this step is skipped."));
    return d;
  }
  d.append(field("Provider name", inp("oa_name", o.name, "shown on the sign-in button, e.g. authentik")));
  d.append(el("div",{class:"row"},
    field("Client ID", inp("oa_clientid", o.client_id, "the OAuth app's client id")),
    field("Client secret", inp("oa_clientsecret", o.client_secret, "the OAuth app's client secret"))));
  d.append(field("Authorization URL", inp("oa_authurl", o.auth_url, "https://idp.example.com/application/o/authorize/")));
  d.append(field("Token URL", inp("oa_tokenurl", o.token_url, "https://idp.example.com/application/o/token/")));
  d.append(field("User-info URL", inp("oa_userinfourl", o.userinfo_url, "https://idp.example.com/application/o/user/")));
  d.append(el("div",{class:"row"},
    field("Scopes", inp("oa_scopes", o.scopes, "openid profile email")),
    field("Public base URI", inp("oa_baseuri", o.base_uri, "https://bevin.example.com"))));
  const ruOut=inp("oa_redirectderived","",""); ruOut.readOnly=true;
  const updateDerived=()=>{ ruOut.value=(String(o.base_uri||"").trim().replace(/\/+$/,""))+"/auth/oauth/callback"; };
  q("#oa_baseuri").addEventListener("input",()=>{ updateDerived(); });
  updateDerived();
  d.append(field("Redirect URI — paste this into the OAuth app registration", ruOut));
  d.append(el("p",{class:"small"},"Enter this server's PUBLIC address — behind your reverse proxy, so https (with a subpath if bevin is served under one, e.g. https://bevin.example.com/bevin). Bevin knows its own callback route and derives the redirect URI from the base (base + /auth/oauth/callback) — there is nothing else to set here. The provider's user identity is mapped to a bevin handle from its preferred_username (else the email's local part, else the subject)."));
  return d;
}
function renderModels(){
  const d=el("div",{},
    el("h3",{}, "4. Main models"),
    el("p",{class:"small"},"Configure the chat models users can switch between. Fill the form, press Detect to identify the provider and list its models, then Add it. The list order below is the order users see when choosing a model."));
  d.append(renderModelForm());
  d.append(renderModelList());
  return d;
}
function renderAux(){
  const d = el("div", {}, el("h3",{}, "5. Aux perception models (optional)"), el("p",{class:"small"},"Vision / audio / video comprehension models — used mid-conversation to read a non-text asset. Hidden from users. Leave empty to skip. Add one, enter its base URL, and press Detect: the provider and the model's modalities are detected where the provider exposes them (llama does; most others don't), otherwise set them manually. A single model may perceive one or more modalities."));
  d.append(renderAuxSection());
  return d;
}
// ---- sidecars step (display-only) ----
// The server auto-provisions the sidecars. This step shows per-sidecar progress
// (checking → downloading → starting → ready) streamed from the server, then a
// confirmation. No user input. _sidecarTimer is the 1s poll (null when stopped).
let _sidecarTimer = null;
function renderSidecars(){
  const d = el("div",{});
  d.append(el("h3",{}, "6. Sidecars"));
  d.append(el("p",{class:"small"},"bevin provisions these local services for you — it downloads + launches each one, all bound to loopback. The llama-server is the embedder; its endpoint is configured for you automatically, so there is no separate embedder step. Stepping back / canceling never uninstalls."));
  d.append(el("div",{class:"sidecar-list", id:"sidecar_list"}));
  d.append(el("div",{class:"sidecar-banner", id:"sidecar_banner"}));
  renderSidecarList();
  return d;
}
const SIDECAR_PLACEHOLDER = [
  {kind:"qdrant", name:"Qdrant", desc:"Vector database — workspace file search", status:"pending", message:"Waiting…", percent:0},
  {kind:"ffmpeg", name:"ffmpeg", desc:"Media decoding — workspace ingest", status:"pending", message:"Waiting…", percent:0},
  {kind:"llama-server", name:"llama-server", desc:"Local embedder (embeddinggemma-2)", status:"pending", message:"Waiting…", percent:0},
];
function statusIcon(status){
  switch(status){
    case "ready": return "✓";
    case "error": return "✕";
    case "downloading": case "starting": return "▸";
    default: return "•";
  }
}
function renderSidecarList(){
  const list = document.getElementById("sidecar_list");
  const banner = document.getElementById("sidecar_banner");
  if(!list) return;
  const st = S.sidecarStatus;
  const rows = (st && st.sidecars && st.sidecars.length) ? st.sidecars : SIDECAR_PLACEHOLDER;
  list.innerHTML = "";
  let allReady = true, anyError = false;
  for(const s of rows){
    const row = el("div",{class:"sidecar-row"});
    row.append(el("span",{class:"sidecar-icon " + (s.status||"pending"), text: statusIcon(s.status)}));
    const body = el("div",{class:"sidecar-body"});
    const head = el("div",{class:"sidecar-head"});
    head.append(el("span",{class:"sidecar-name"}, s.name || s.kind));
    if(s.desc) head.append(el("span",{class:"sidecar-desc"}, s.desc));
    body.append(head);
    let detail = s.message || "";
    if(s.status === "ready" && s.endpoint) detail = (detail ? detail + " — " : "") + s.endpoint;
    else if(s.status === "error" && s.error) detail = s.error;
    if(detail) body.append(el("div",{class:"sidecar-msg"}, detail));
    const bar = el("div",{class:"sidecar-bar"});
    const fill = el("div",{class:"sidecar-fill " + (s.status||"pending")});
    fill.style.width = (s.percent||0) + "%";
    bar.append(fill);
    body.append(bar);
    row.append(body);
    list.append(row);
    if(s.status !== "ready") allReady = false;
    if(s.status === "error") anyError = true;
  }
  const next = document.getElementById("next");
  banner.className = "sidecar-banner";
  banner.innerHTML = "";
  if(st && st.done && allReady && !anyError){
    banner.classList.add("ok");
    banner.append(el("span",{}, "All sidecars are ready."));
    if(next) next.disabled = false;
  } else {
    if(anyError){
      banner.classList.add("err");
      banner.append(el("span",{}, "A sidecar failed to set up. "));
      const retry = el("button",{class:"sidecar-retry", onclick:"startSidecars()"},"Retry");
      banner.append(retry);
    } else if(st && st.running){
      banner.append(el("span",{}, "Setting up sidecars… this can take a few minutes (the llama-server model load is the slow part). You can wait here."));
    } else {
      banner.append(el("span",{}, "Preparing to set up the sidecars…"));
    }
    if(next) next.disabled = true;
  }
}
async function startSidecars(){
  if(_sidecarTimer) return; // already polling
  try{ S.sidecarStatus = await api("POST", "/setup/sidecars/start", {}); }
  catch(e){ S.sidecarStatus = null; }
  renderSidecarList();
  if(!_sidecarTimer) _sidecarTimer = setInterval(pollSidecars, 1000);
}
async function pollSidecars(){
  if(STEPS[idx] !== "sidecars"){ stopSidecarPoll(); return; }
  try{
    const st = await api("GET", "/setup/sidecars/status");
    S.sidecarStatus = st;
    renderSidecarList();
    if(st && st.done) stopSidecarPoll();
  }catch(e){ /* transient; keep polling */ }
}
function stopSidecarPoll(){ if(_sidecarTimer){ clearInterval(_sidecarTimer); _sidecarTimer = null; } }
function renderEmail(){
  const d = el("div",{});
  d.append(el("h3",{}, "7. Email notifications (optional)"));
  d.append(el("p",{class:"small"},"bevin can email users and the admin (a task finished, something needs attention, \u2026). Leave it off to skip — you can add it later in Settings. When on, bevin sends through your SMTP server."));
  d.append(renderEmailForm());
  return d;
}
function renderReview(){ const d=el("div",{},el("h3",{}, "8. Review & finish"));
  // The review shows the SAVED answers only — strip the per-draft working
  // state (_models / _detecting / _lastBase: probe results + UI flags) and the
  // transient sidecar progress, so nothing ephemeral looks like config.
  const shown = JSON.parse(JSON.stringify(S));
  function stripUnderscore(o){ if(!o || typeof o !== "object") return o; if(Array.isArray(o)) return o.map(stripUnderscore); for(const k of Object.keys(o)) if(k.startsWith("_")) delete o[k]; return o; }
  shown.modelDraft = stripUnderscore(shown.modelDraft);
  shown.aux = stripUnderscore(shown.aux);
  delete shown.sidecarStatus;
  d.append(el("pre",{class:"kv"}, JSON.stringify(shown, null, 2)));
  d.append(el("p",{class:"small"},"Finishing writes server.toml (0600, holds secrets), creates the admin, and provisions the sidecars. The server then switches to normal mode in-process — no restart."));
  return d;
}
const RENDER = { server:renderServer, admin:renderAdmin, oauth:renderOAuth, models:renderModels, aux:renderAux, sidecars:renderSidecars, email:renderEmail, review:renderReview };

// ---- nav ----
function sync(id, v){ /* handled by per-field listeners */ }
function render(){
  document.getElementById("body").innerHTML="";
  document.getElementById("body").append(RENDER[STEPS[idx]]());
  const st=document.getElementById("steps");
  st.style.display=""; st.innerHTML="";
  STEPS.forEach((s,i)=>{ const e=el("span",{class:"step"+(i===idx?" active":""), text:s}); if(i<idx)e.classList.add("done"); st.append(e); });
  document.getElementById("finalize").classList.toggle("hidden", STEPS[idx]!=="review");
  document.getElementById("next").classList.toggle("hidden", STEPS[idx]==="review");
  refreshScoreFills();
  // Sidecars step: start the (idempotent) provisioning + stream progress when
  // the admin lands on it (startSidecars guards against re-starting the poll).
  if(STEPS[idx] === "sidecars" && !_sidecarTimer){ startSidecars(); }
}
async function api(method, path, body){ const url = path; const opt={method}; if(body){opt.headers={"Content-Type":"application/json"}; opt.body=JSON.stringify(body);} const r=await fetch(url,opt); let j=null; try{j=await r.json();}catch(_){} if(!r.ok) throw new Error((j&&j.error)||("HTTP "+r.status)); return j; }
async function doNext(){
  const step=STEPS[idx];
  // gather per-step data from inputs into S (admin, sidecars via id-based reads)
  if(step==="admin"){ S.admin.handle=q("#ad_handle").value||q("#ad_handle").placeholder; S.admin.display_name=q("#ad_name").value||q("#ad_name").placeholder; S.admin.password=q("#ad_pw").value; if(q("#ad_pw").value!==q("#ad_pw2").value){msg("Passwords do not match","err");return;} }
  // The OAuth step: gather the inputs + mirror the server's normalization
  // (normalizeOAuth) so the review step shows the effective values. The
  // fields only exist while the step is enabled — gathering is skipped when
  // it's off (the stored draft is kept; a disabled IdP is ignored at runtime).
  if(step==="oauth" && S.oauth.enabled){ const o=S.oauth; o.name=q("#oa_name").value; o.client_id=q("#oa_clientid").value; o.client_secret=q("#oa_clientsecret").value; o.auth_url=q("#oa_authurl").value; o.token_url=q("#oa_tokenurl").value; o.userinfo_url=q("#oa_userinfourl").value; o.scopes=q("#oa_scopes").value; o.base_uri=q("#oa_baseuri").value; ["name","client_id","client_secret","auth_url","token_url","userinfo_url","scopes","base_uri"].forEach(k=>{ o[k]=String(o[k]||"").trim(); }); if(o.enabled){ if(!o.name) o.name="OAuth"; if(!o.scopes) o.scopes="openid profile email"; } }
  // The sidecars step is display-only: require all sidecars ready before
  // advancing (the Next button is disabled until then — belt-and-suspenders).
  if(step==="sidecars"){ const st=S.sidecarStatus; const allReady = st && st.sidecars && st.sidecars.every(s=>s.status==="ready"); if(!allReady){ msg("Wait for the sidecars to finish setting up.","err"); return; } }
  // The email step: a blank field uses its PLACEHOLDER default (port 587,
  // from name "bevin", from address = the username) — the server applies the
  // same defaults in validateEmail (source of truth). Normalize in place so
  // the review step shows the effective values (the admin step does the same
  // with its placeholder fallbacks).
  if (S.email.enabled) {
    S.email.smtp_port = String(parseInt(S.email.smtp_port, 10) || 587);
    if (!S.email.from_name) S.email.from_name = "bevin";
    if (!S.email.from_address && S.email.username) S.email.from_address = S.email.username;
  }
  const emailPayload = Object.assign({}, S.email, { smtp_port: parseInt(S.email.smtp_port, 10) || (S.email.enabled ? 587 : 0) });
  // Aux models: strip the per-draft working state (_models / _lastBase /
  // _detecting) so only the saved config crosses the wire.
  const auxPayload = (S.aux||[]).map(m => { const c = JSON.parse(JSON.stringify(m)); for(const k of Object.keys(c)) if(k.startsWith("_")) delete c[k]; return c; });
  try{
    await api("POST","/setup/advance",{step, admin:S.admin, oauth:S.oauth, models:S.models, aux:auxPayload, sidecars:S.sidecars, email:emailPayload});
    msg("");
    if(step==="review") return;
    idx=Math.min(idx+1, STEPS.length-1); render();
  }catch(e){ msg(e.message,"err"); }
}
async function doBack(){ if(idx>0){ idx--; try{ await api("POST","/setup/back",{step:STEPS[idx]}); }catch(_){} render(); } }
async function doCancel(){ if(confirm("Cancel setup? (In-memory state is discarded; sidecars already downloaded remain.)")){ stopSidecarPoll(); await api("POST","/setup/cancel",{}); S={admin:{handle:"",display_name:"",password:""},oauth:{enabled:false,name:"",client_id:"",client_secret:"",auth_url:"",token_url:"",userinfo_url:"",scopes:"",base_uri:""},models:[],aux:[],auxError:{},sidecars:{qdrant:"",llama_server:"",ffmpeg:""},sidecarStatus:null,email:{enabled:false,smtp_host:"",smtp_port:"",username:"",password:"",from_address:"",from_name:"",use_starttls:true}}; idx=0; msg("Setup cancelled — nothing written.","ok"); render(); } }
async function doFinalize(){ msg("Finalizing…",""); try{ const r=await api("POST","/setup/finalize",{});
  msg(""); // success: clear the status line — #msg sits OUTSIDE #body, so it would otherwise linger over the completion screen
  // The admin does not use the chat UI as a regular user — after setup they go
  // to the admin dashboard (a real button, not a link into the user UI).
  const body = document.getElementById("body");
  body.innerHTML = "";
  const h = el("h3", {}, "Setup complete");
  body.append(h);
  body.append(el("p", {}, "bevin is running in normal mode. The admin account you just created signs in to the admin dashboard."));
  // The button lives in a .btns container — that's where the button styling
  // (base + .primary) is scoped — so it matches the wizard's design language.
  const b = el("button", {class:"primary"}, "Go to the admin dashboard");
  b.onclick = () => { location.href = "/admin"; };
  body.append(el("div", {class:"btns", style:"margin-top:1rem"}, b));
  document.getElementById("finalize").classList.add("hidden");
  document.getElementById("next").classList.add("hidden");
  document.getElementById("back").classList.add("hidden");
  document.getElementById("cancel").classList.add("hidden");
}catch(e){ msg("Finalize failed: "+e.message,"err"); } }
function q(s){ return document.querySelector(s); }

document.getElementById("next").onclick=doNext;
document.getElementById("back").onclick=doBack;
document.getElementById("cancel").onclick=doCancel;
document.getElementById("finalize").onclick=doFinalize;
document.getElementById("themeToggle").addEventListener("click", function(){
  var root=document.documentElement;
  var next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("bevin-theme",next);}catch(e){}
});
render();
</script>
