<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bevin — setup</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<script>
  (function(){try{var t=localStorage.getItem("bevin-theme");
    if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
    document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<style>
  /* wizard layout, on top of brand.css (Nunito + warm tokens) */
  body { max-width: 920px; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }
  .setup-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin: .3rem 0 0; }
  .steps { display:flex; gap:.4rem; flex-wrap:wrap; margin: 1.1rem 0 .4rem; }
  .step { padding:.2rem .7rem; border:1px solid var(--border); border-radius:999px; font-size:.8rem; font-weight:700; color:var(--text-muted); background:var(--surface); }
  .step.done { color:var(--brand-strong); border-color:var(--brand-soft); background:var(--brand-softer); }
  .step.active { background:var(--brand); color:var(--brand-contrast); border-color:transparent; }
  .card { margin-top: 1rem; }
  .model { border:1px dashed var(--border); border-radius:var(--radius); padding:.6rem .85rem; margin-top:.8rem; background:var(--surface-2); }
  .row { display:flex; gap:.6rem; } .row > div { flex:1; }
  .btns { display:flex; gap:.5rem; margin-top:1.2rem; flex-wrap:wrap; }
  .btns button { font:inherit; font-weight:700; cursor:pointer; padding:.55rem 1.05rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); transition:background .15s; }
  .btns button:hover { background:var(--surface-2); }
  .btns button.primary { background:var(--brand); color:var(--brand-contrast); border-color:transparent; box-shadow:var(--shadow-sm); }
  .btns button.primary:hover { background:var(--brand-hover); }
  .btns button.ghost { background:transparent; border-color:transparent; color:var(--text-muted); }
  .msg { margin-top:.8rem; font-size:.85rem; font-weight:600; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .small { font-size:.82rem; color:var(--text-muted); }
  .hidden { display:none; }
  .kv { font-family:var(--font-mono); font-size:.8rem; background:var(--surface-2); padding:.1em .4em; border-radius:6px; }
  pre.kv { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:.8rem; overflow:auto; margin:0; }
  .pw-wrap { display:flex; gap:.4rem; align-items:center; }
  .pw-wrap input { flex:1; }
  .pw-toggle { font:inherit; font-size:.78rem; font-weight:700; white-space:nowrap; padding:.3rem .6rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text-muted); cursor:pointer; }
  .pw-toggle:hover { background:var(--surface-2); }
  /* score sliders — a progress bar whose fill goes red (1) → yellow (5) → green (10) */
  .score-field { margin-top:.55rem; }
  .score-field > label { display:block; font-size:.82rem; font-weight:600; margin-bottom:.25rem; }
  .score-row { display:flex; align-items:center; gap:.55rem; }
  .score-row .score { flex:1; }
  .score-val { font-family:var(--font-mono); font-size:.78rem; font-weight:700; min-width:1.6em; text-align:center; color:var(--text-muted); }
  /* slider — the fill's right edge must land on the thumb center. Two non-obvious
     resets, both of which used to break alignment in real browsers:
     (1) padding:0 — the global `input` rule sets padding:0.6rem 0.85rem, so the
         thumb otherwise travels on the narrower CONTENT box (inset ~13.6px) while
         the fill gradient spans the full border box, giving a value-dependent
         offset (fill short at low, long at high).
     (2) no border (box-shadow inset for the visual border) — a real 1px border
         (border-box) shifts the gradient's 100% vs the thumb's travel range by 2px.
     With padding:0 + no border, the thumb (18px, box-sizing:border-box) travels the
     full clientWidth, so the JS-computed fill position (see scoreFill) lands on the
     thumb center at every value + width. */
  input.score { -webkit-appearance:none; appearance:none; padding:0; width:100%; height:10px; border-radius:6px; border:none; box-shadow: inset 0 0 0 1px var(--border); outline:none; cursor:pointer; --thumb:18px; --pos:calc(var(--val,0) * (100% - var(--thumb)) + var(--thumb)/2); background:linear-gradient(to right, var(--score-color, var(--surface)) var(--pos), var(--surface) var(--pos)); }
  input.score::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; box-sizing:border-box; width:18px; height:18px; border-radius:50%; background:var(--surface); border:2px solid var(--text-muted); cursor:pointer; }
  input.score::-moz-range-thumb { box-sizing:border-box; width:18px; height:18px; border-radius:50%; background:var(--surface); border:2px solid var(--text-muted); cursor:pointer; }
  input.score:disabled { opacity:.5; cursor:not-allowed; }
  /* Enable for users — a Yes/No segmented button that fills the field width */
  .yesno { display:flex; width:100%; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .yesno button { flex:1; font:inherit; font-weight:700; padding:.5rem; border:none; background:var(--surface); color:var(--text-muted); cursor:pointer; transition:background .15s; }
  .yesno button + button { border-left:1px solid var(--border); }
  .yesno button.sel { background:var(--brand); color:var(--brand-contrast); }
  .yesno button:not(.sel):hover { background:var(--surface-2); }
  .yesno button:disabled { opacity:.5; cursor:not-allowed; }
  /* add/edit model form — split into two labelled halves */
  .config-half { border:1px solid var(--border); border-radius:var(--radius); padding:.8rem 1rem; margin-top:.8rem; background:var(--surface); }
  .config-half > h4 { margin:0 0 .7rem; font-size:.8rem; font-weight:800; color:var(--brand-strong); text-transform:uppercase; letter-spacing:.03em; }
  .form-btns { display:flex; justify-content:center; gap:.6rem; margin-top:.85rem; }
  .form-btns button { font:inherit; font-weight:700; cursor:pointer; padding:.5rem 1.05rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); }
  .form-btns button.primary { background:var(--brand); color:var(--brand-contrast); border-color:transparent; box-shadow:var(--shadow-sm); }
  .form-btns button.ghost { background:transparent; border-color:transparent; color:var(--text-muted); }
  .form-err { margin-top:.55rem; font-size:.82rem; font-weight:600; color:var(--danger); }
  .field-help { font-size:.78rem; color:var(--text-muted); margin:.15rem 0 .1rem; }
  .scores-header { margin:.9rem 0 .1rem; font-size:.78rem; font-weight:800; color:var(--brand-strong); text-transform:uppercase; letter-spacing:.03em; }
  input.ctx-disabled { opacity:.65; cursor:not-allowed; }
  /* model list table */
  .model-table { width:100%; border-collapse:collapse; margin-top:.8rem; font-size:.85rem; }
  .model-table th, .model-table td { text-align:left; padding:.36rem .45rem; border-bottom:1px solid var(--border); }
  .model-table th { font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); }
  .model-table .reorder { display:inline-flex; flex-direction:column; gap:.12rem; }
  .model-table .reorder button { font:inherit; font-size:.68rem; line-height:1; padding:.05rem .32rem; border:1px solid var(--border); border-radius:4px; background:var(--surface); cursor:pointer; }
  .model-table .reorder button:disabled { opacity:.35; cursor:default; }
  .model-table .row-btn { font:inherit; font-size:.75rem; font-weight:700; padding:.22rem .55rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); cursor:pointer; }
  .model-table .row-btn:hover { background:var(--surface-2); }
  .empty-list { color:var(--text-muted); font-size:.85rem; font-style:italic; padding:.6rem 0; }
  .model-table .kv { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; }
  .model-table .baseurl { max-width:160px; }
  .model-table .badge-unavail { display:inline-block; font-size:.7rem; font-weight:700; color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent); padding:.08rem .42rem; border-radius:999px; }
  .form-notice { font-size:.82rem; color:var(--text); background:color-mix(in srgb, var(--warn) 14%, transparent); border:1px solid var(--warn); padding:.5rem .7rem; border-radius:var(--radius); margin:.6rem 0; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
  <svg class="ico-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>
<div>
  <a class="brand" href="/setup"><img src="/logo-mark.svg" alt="bevin logo"> bevin</a>
  <div class="setup-title">First-time setup</div>
</div>
<p class="small">plain HTTP — put a reverse proxy in front for TLS &middot; Setup is token-gated and in-memory; nothing is written until you finish.</p>
<div class="steps" id="steps"></div>

<div class="card">
  <div id="body"></div>
</div>

<div class="btns">
  <button id="back">Back</button>
  <button id="next" class="primary">Next</button>
  <button id="finalize" class="primary hidden">Finish &amp; start</button>
  <button id="cancel" class="ghost">Cancel</button>
</div>
<div class="msg" id="msg"></div>

<script>
const STEPS = {{.Steps | jsonify}};
const SERVER = {{.Server | jsonify}};
const IS_EDIT = {{if .Edit}}true{{else}}false{{end}};
// In edit mode the routes are namespaced under /admin and the admin-identity
// step is skipped (the admin already exists), so start on the models step.
let idx = IS_EDIT ? Math.max(0, STEPS.indexOf("models")) : 0;
let S = { admin: {handle:"",display_name:"",password:""}, models: [], modelDraft: {provider:"",base_url:"",api_key:"",model_id:"",display_name:"",max_context:"",context_auto:false,metadata:{reasoning:5,knowledge:5,speed:5},slots:1,enabled:true,auto_disabled:false,lockedTo:null}, editingIndex: -1, editOriginal: null, formError: null, aux: [], embedder: {base_url:""}, sidecars: {qdrant:"",llama_server:"",ffmpeg:""}, detectedCache: {} };

function el(tag, attrs, ...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs||{})){ if(k==="class")e.className=v; else if(k==="text")e.textContent=v; else e.setAttribute(k,v);} for(const c of kids){ e.append(c.nodeType?c:document.createTextNode(c)); } return e; }
function msg(t, cls){ const m=document.getElementById("msg"); m.textContent=t||""; m.className="msg"+(cls?" "+cls:""); }
function field(label, input){ return el("div",{},el("label",{},label),input); }
function inp(id, val, ph){ const i=el("input",{id, value:val||"", placeholder:ph||""}); i.addEventListener("input",()=>sync(id,i.value)); return i; }
function pwfield(label, id, val, ph){ const i=el("input",{id, type:"password", value:val||"", placeholder:ph||""}); i.addEventListener("input",()=>sync(id,i.value)); const b=el("button",{type:"button", class:"pw-toggle"}, "Show"); b.onclick=function(){ const show=i.type==="password"; i.type=show?"text":"password"; b.textContent=show?"Hide":"Show"; b.setAttribute("aria-pressed", show?"true":"false"); }; const wrap=el("div",{class:"pw-wrap"},i,b); return el("div",{},el("label",{},label),wrap); }

// ---- per-step renderers ----
function renderServer(){ return el("div",{},
  el("h3",{}, "1. Server"),
  el("p",{}, "Review the server basics (set via CLI flags; not editable here)."),
  field("Data dir", el("span",{class:"kv"},SERVER.dataDir)),
  field("Bind / port", el("span",{class:"kv"},SERVER.bind + " : " + SERVER.port + " (CLI)"))
);}
function renderAdmin(){ const a=S.admin; return el("div",{},
  el("h3",{}, "2. Identity & admin"),
  el("p",{class:"small"},"The admin account is the server's own IdP (no external login). It is the only account that can create users."),
  field("Handle", inp("ad_handle", a.handle, "admin")),
  field("Display name", inp("ad_name", a.display_name, "Administrator")),
  el("div",{class:"row"},
    pwfield("Password", "ad_pw", a.password, "min 8 chars"),
    pwfield("Confirm", "ad_pw2", a.password, ""))
);}
function renderModels(){
  const d=el("div",{},
    el("h3",{}, "3. Main models"),
    el("p",{class:"small"},"Configure the chat models users can switch between. Fill the form, press Detect to identify the provider and list its models, then Add it. The list order below is the order users see when choosing a model."));
  d.append(renderModelForm());
  d.append(renderModelList());
  return d;
}
function renderModelForm(){
  const m=S.modelDraft, editing=S.editingIndex!==-1;
  const f=el("div",{});
  // half A: provider configuration
  const halfA=el("div",{class:"config-half"}, el("h4",{}, "Provider configuration"));
  const base=inp("mf_base", m.base_url, "https://api.openai.com");
  // combobox — once a provider has been added, re-select its base URL from the datalist
  base.setAttribute("list","mf_base_urls");
  const baseDl=el("datalist",{id:"mf_base_urls"});
  [...new Set(S.models.map(x=>(x.base_url||"").trim()).filter(Boolean))].forEach(u=>{ baseDl.append(el("option",{value:u})); });
  const key=inp("mf_key", m.api_key, "blank for a local llama-server");
  const provLabel=m.provider?el("span",{class:"kv"},m.provider):el("span",{class:"small"},"— press Detect —");
  // Detect / Clear centered under the base URL + API key (the association is clear)
  halfA.append(
    el("div",{class:"row"}, field("Base URL", el("div",{}, base, baseDl)), field("API key",key)),
    el("div",{class:"form-btns"},
      el("button",{class:"ghost", onclick:"cancelEdit()"}, editing?"Cancel":"Clear"),
      el("button",{class:"primary", onclick:"detectModel()"},"Detect")),
    field("Provider", provLabel)
  );
  if(S.formError) halfA.append(el("p",{class:"form-err"}, S.formError));
  f.append(halfA);
  // half B: in-agent UI configuration (what users see)
  const halfB=el("div",{class:"config-half"}, el("h4",{}, "In-agent UI (what users see)"));
  // Model (the provider's model id)
  const sel=el("select",{id:"mf_sel"});
  const allModels=m._models||[];
  const available=allModels.filter(mm=>!modelAlreadyAdded(mm.ID, m.base_url)); // hide models already added for this provider
  if(!allModels.length){ sel.append(el("option",{value:""},"— press Detect —")); }
  else if(!available.length){ sel.append(el("option",{value:"", disabled:true, selected:true}, "all "+allModels.length+" model(s) from this provider are already added")); }
  else { available.forEach(mm=>{ const o=el("option",{value:mm.ID}, mm.ID+(mm.MaxContext?"  ("+mm.MaxContext+" tokens)":"")); if(m.model_id===mm.ID) o.selected=true; sel.append(o); }); }
  sel.addEventListener("change",()=>{ m.model_id=sel.value; const mm=allModels.find(x=>x.ID===sel.value); if(mm&&mm.MaxContext){ m.max_context=String(mm.MaxContext); m.context_auto=true; } else { m.max_context=""; m.context_auto=false; } S.formError=null; render(); });
  // Max context
  const ctx=el("input",{id:"mf_ctx", value:m.max_context||"", class:m.context_auto?"ctx-disabled":null});
  if(m.context_auto) ctx.setAttribute("disabled","");
  ctx.addEventListener("input",()=>{ m.max_context=ctx.value; m.context_auto=false; S.formError=null; });
  // Display name — a combobox (text input + a datalist of the existing display names).
  // Picking an existing name inherits its R/K/S + enabled state and locks them, so all
  // models sharing a display name stay consistent.
  const disp=el("input",{id:"mf_disp", value:m.display_name||"", list:"disp_names", autocomplete:"off"});
  const dl=el("datalist",{id:"disp_names"});
  [...new Set(S.models.map(x=>(x.display_name||"").trim()).filter(Boolean))].forEach(n=>{ dl.append(el("option",{value:n})); });
  // Enable for users — a Yes/No segmented button
  const locked=(m.lockedTo!==null && m.lockedTo!==undefined);
  const en=el("div",{class:"yesno"});
  const yesB=el("button",{type:"button", class:m.enabled?"sel":""}, "Yes");
  const noB=el("button",{type:"button", class:!m.enabled?"sel":""}, "No");
  if(locked){ yesB.setAttribute("disabled",""); noB.setAttribute("disabled",""); }
  yesB.addEventListener("click",()=>{ if(locked)return; m.enabled=true; S.formError=null; render(); });
  noB.addEventListener("click",()=>{ if(locked)return; m.enabled=false; S.formError=null; render(); });
  en.append(yesB,noB);
  halfB.append(
    field("Model", sel),
    // Max context — the help text sits under the label (above the input)
    el("div",{},
      el("label",{},"Max context"),
      el("p",{class:"field-help"},"The model's maximum context window in tokens — required so the agent knows how much history and prompt it can use before truncating or compacting. Auto-filled from the provider when it exposes it; enter it manually otherwise."),
      ctx),
    el("div",{class:"row"},
      field("Display name", el("div",{}, disp, dl)),
      field("Enable for users", en)),
    el("p",{class:"field-help"},"Shown to users to help them pick a model — informational only. Pick an existing name to reuse it: its scores + enabled state are inherited and locked so every model sharing a name stays consistent."),
    (m.auto_disabled ? el("p",{class:"form-notice"},"This model is currently <strong>unavailable</strong> — the provider reported it missing, so it was auto-disabled and hidden from users. It re-enables automatically once a later attempt succeeds; you do not need to change anything.") : null),
    el("h5",{class:"scores-header"},"Scores (1-10)"),
    el("p",{class:"field-help"},"Help the user gauge a model's strengths when picking one for a conversation — informational only; it does not change how the agent runs."),
    scoreSlider("Reasoning (1-10)","mf_r", m.metadata.reasoning||5, (v)=>{ m.metadata.reasoning=v; }, locked),
    scoreSlider("Knowledge (1-10)","mf_k", m.metadata.knowledge||5, (v)=>{ m.metadata.knowledge=v; }, locked),
    scoreSlider("Speed (1-10)","mf_s", m.metadata.speed||5, (v)=>{ m.metadata.speed=v; }, locked)
  );
  f.append(halfB);
  // the save button
  f.append(el("div",{class:"btns"}, el("button",{class:"primary", onclick:"saveModel()"}, editing?"Save changes":"+ Add model")));
  // wire the inputs
  base.addEventListener("input",()=>{
    m.base_url=base.value; S.formError=null;
    const nb=(base.value||"").trim();
    if(nb && isKnownProvider(nb) && normBase(nb)!==normBase(_lastAutoBase)){
      _lastAutoBase=base.value;
      const cached=S.detectedCache[normBase(nb)];
      if(cached){
        // re-use the previously detected result — no re-fetch
        m._models=cached.models; m.provider=cached.provider;
        const avail=cached.models.filter(x=>!modelAlreadyAdded(x.ID, m.base_url));
        m.model_id=avail.length?avail[0].ID:"";
        if(m.model_id){ const sel=cached.models.find(x=>x.ID===m.model_id); if(sel&&sel.MaxContext){ m.max_context=String(sel.MaxContext); m.context_auto=true; } }
        render();
      } else {
        detectModel();
      }
    } else {
      _lastAutoBase=base.value;
    }
  });
  key.addEventListener("input",()=>{ m.api_key=key.value; S.formError=null; });
  disp.addEventListener("input",()=>{ m.display_name=disp.value; });
  disp.addEventListener("change",()=>{ m.display_name=disp.value; syncDispLock(); S.formError=null; render(); });
  _lastAutoBase=m.base_url; // sync so re-rendering the form doesn't auto-detect the current value
  return f;
}
function renderModelList(){
  const w=el("div",{});
  if(!S.models.length){ w.append(el("p",{class:"empty-list"},"No models added yet — fill the form above and press \u201cAdd model\u201d.")); return w; }
  const t=el("table",{class:"model-table"});
  t.append(el("thead",{}, el("tr",{},
    el("th",{}, ""), el("th",{}, "Display name"), el("th",{}, "Provider"), el("th",{}, "Base URL"), el("th",{}, "Model ID"), el("th",{}, "Context"), el("th",{}, "R/K/S"), el("th",{}, "On"), el("th",{}, ""))));
  const tb=el("tbody",{});
  S.models.forEach((m,i)=>{
    const up=el("button",{title:"Move up", onclick:`reorderModel(${i},-1)`}, "\u25b2"); if(i===0) up.setAttribute("disabled","");
    const dn=el("button",{title:"Move down", onclick:`reorderModel(${i},1)`}, "\u25bc"); if(i===S.models.length-1) dn.setAttribute("disabled","");
    tb.append(el("tr",{},
      el("td",{}, el("div",{class:"reorder"}, up, dn)),
      el("td",{}, el("span",{class:"kv", title:m.display_name||""}, m.display_name||"(unnamed)")),
      el("td",{}, m.provider||"—"),
      el("td",{}, el("span",{class:"kv baseurl", title:m.base_url||""}, m.base_url||"—")),
      el("td",{}, el("span",{class:"kv"}, m.model_id||"—")),
      el("td",{}, m.max_context?m.max_context:"auto"),
      el("td",{}, (m.metadata.reasoning||0)+"/"+(m.metadata.knowledge||0)+"/"+(m.metadata.speed||0)),
      el("td",{}, m.auto_disabled ? el("span",{class:"badge-unavail", title:"The provider reported this model unavailable, so it was auto-disabled. It re-enables automatically when a later attempt succeeds."},"unavailable") : (m.enabled?"yes":"no")),
      el("td",{}, el("button",{class:"row-btn", onclick:`editModel(${i})`},"Edit"))));
  });
  t.append(tb);
  w.append(t);
  return w;
}
function renderAux(){ const d=el("div",{},el("h3",{}, "4. Aux perception models (optional)"), el("p",{class:"small"},"Vision / audio / video comprehension models. Hidden from users. Leave empty to skip."));
  S.aux.forEach((m,i)=>{
    const card=el("div",{class:"model"},
      field("Modality (vision|audio|video)", inp("a_mod_"+i, m.modality, "vision")),
      field("Provider", inp("a_prov_"+i, m.provider, "llama")),
      field("Base URL", inp("a_base_"+i, m.base_url, "")),
      field("Model ID", inp("a_id_"+i, m.model_id, "")),
      el("button",{onclick:`removeAux(${i})`},"Remove"));
    ["modality","provider","base_url","model_id","api_key"].forEach(k=>{ const e=card.querySelector("#a_"+k+"_"+i); if(e) e.addEventListener("input",()=>S.aux[i][k]=e.value); });
    d.append(card);
  });
  d.append(el("div",{class:"btns"},el("button",{onclick:"addAux()"},"+ Add aux model")));
  return d;
}
function renderEmbedder(){ const e=S.embedder; return el("div",{},
  el("h3",{}, "5. Embedder"),
  el("p",{class:"small"},"The local llama-server running embeddinggemma-2 (loopback). It is the single embedding pipeline for memories, history, and workspace retrieval."),
  field("Base URL", inp("emb_base", e.base_url, "http://127.0.0.1:8081/v1"))
);}
function renderSidecars(){ const c=S.sidecars; return el("div",{},
  el("h3",{}, "6. Embedder & sidecars"),
  el("p",{class:"small"},"Leave an endpoint blank to auto-provision (download + launch, idempotent, forward-only). All sidecars bind to loopback. Stepping back / canceling never uninstalls."),
  field("Qdrant endpoint", inp("sc_qdrant", c.qdrant, "http://127.0.0.1:6333 (blank = auto)")),
  field("llama-server endpoint", inp("sc_llama", c.llama_server, "http://127.0.0.1:8081 (blank = auto)")),
  field("ffmpeg path", inp("sc_ffmpeg", c.ffmpeg, "blank = use system or auto")),
  el("div",{class:"btns"},el("button",{onclick:"testQdrant()"},"Test Qdrant"), el("button",{onclick:"testLlama()"},"Test llama-server"))
);}
function renderReview(){ const d=el("div",{},el("h3",{}, "7. Review & finish"));
  d.append(el("pre",{class:"kv"}, JSON.stringify(S, null, 2)));
  d.append(el("p",{class:"small"},"Finishing writes server.toml (0600, holds secrets), creates the admin, and provisions the sidecars. The server then switches to normal mode in-process — no restart."));
  return d;
}
const RENDER = { server:renderServer, admin:renderAdmin, models:renderModels, aux:renderAux, embedder:renderEmbedder, sidecars:renderSidecars, review:renderReview };

// ---- model form helpers ----
function freshModel(){ return {provider:"",base_url:"",api_key:"",model_id:"",display_name:"",max_context:"",context_auto:false,metadata:{reasoning:5,knowledge:5,speed:5},slots:1,enabled:true,auto_disabled:false,lockedTo:null}; }
// base-URL normalization for "is this the same provider?" comparisons — match the
// server probe, which treats scheme/host variants and a trailing /v1 as the same
// endpoint (it tries /models and /v1/models). Trim, drop trailing slashes, drop /v1.
function normBase(u){ return (u||"").trim().replace(/\/+$/,"").replace(/\/v1$/i,""); }
// is this model id already added for this base URL (i.e. already in the model list for this provider)?
function modelAlreadyAdded(id, base){ return S.models.some(x => x.model_id===id && normBase(x.base_url)===normBase(base)); }
// is this base URL already a configured provider (in the model list)? drives auto-detect
// when the admin re-selects an existing provider from the Base URL combobox.
function isKnownProvider(base){ return S.models.some(x => (x.base_url||"").trim()!=="" && normBase(x.base_url)===normBase(base)); }
// auto-detect state: re-selecting a known provider re-uses the previously detected
// model list (no re-fetch). _lastAutoBase avoids re-triggering on the same value.
let _lastAutoBase="";
function resetDraft(){ S.modelDraft=freshModel(); S.editingIndex=-1; S.editOriginal=null; S.formError=null; }
function deepCopy(x){ return JSON.parse(JSON.stringify(x)); }
// lock the R/K/S + enabled to a display name's pre-existing values (so every model
// sharing a display name stays consistent); unlock when the name is new (keeps the
// current R/K/S + enabled)
function syncDispLock(){
  const m=S.modelDraft;
  const name=(m.display_name||"").trim();
  const match=S.models.find(x=>(x.display_name||"").trim()===name);
  if(match){
    if(m.lockedTo!==name){ m.metadata=deepCopy(match.metadata); m.enabled=match.enabled; m.lockedTo=name; }
  } else if(m.lockedTo!==null && m.lockedTo!==undefined){
    m.lockedTo=null; // unlock — keep the current R/K/S + enabled
  }
}
function suggestedFix(err){
  const e=String(err).toLowerCase();
  if(e.includes("401")||e.includes("403")||e.includes("unauthorized")||e.includes("forbidden")) return "check the API key.";
  if(e.includes("404")) return "check the base URL (the /models path was not found there).";
  if(e.includes("timeout")||e.includes("deadline")||e.includes("refused")||e.includes("connection")||e.includes("no such host")) return "check the base URL is reachable from this machine (correct host, port, and network).";
  if(e.includes("no models")) return "the endpoint is reachable but listed no models — check the base URL.";
  if(e.includes("could not parse")) return "the endpoint did not return a recognized /models list — check the base URL.";
  return "check the base URL (and API key if the provider needs one).";
}
function saveModel(){
  const m=S.modelDraft;
  if(!m.base_url){ S.formError="Base URL is required."; render(); return; }
  if(!m.model_id){ S.formError="Pick a model — press Detect to list the provider's models."; render(); return; }
  if(!m.display_name){ S.formError="Display name is required (what users will see)."; render(); return; }
  if(!m.max_context){ S.formError="Max context is required — the provider did not expose it, so enter it manually."; render(); return; }
  const wasEditing=S.editingIndex!==-1;
  const toSave=deepCopy(m); delete toSave._models;
  // max_context is a string in the draft (from the input); the server's config
  // expects an int, so normalize it before the model enters S.models.
  const mc=parseInt(toSave.max_context,10);
  if(!Number.isFinite(mc) || mc<=0){ S.formError="Max context must be a positive integer (tokens)."; render(); return; }
  toSave.max_context=mc;
  if(!wasEditing){ S.models.push(toSave); } else { const idx=Math.min(S.editingIndex,S.models.length); S.models.splice(idx,0,toSave); }
  resetDraft(); render(); msg(wasEditing?"Model saved.":"Model added.","ok");
}
function editModel(i){
  S.editOriginal=deepCopy(S.models[i]);
  S.modelDraft=deepCopy(S.models[i]);
  S.editingIndex=i; S.models.splice(i,1); S.formError=null;
  syncDispLock(); // lock the R/K/S + enabled if this display name is shared with another model
  render();
  const b=document.getElementById("mf_base"); if(b) b.scrollIntoView({behavior:"smooth",block:"center"});
}
function cancelEdit(){
  if(S.editingIndex!==-1 && S.editOriginal){
    const idx=Math.min(S.editingIndex,S.models.length);
    S.models.splice(idx,0,S.editOriginal);
  }
  resetDraft(); render();
}
function reorderModel(i,dir){
  const j=i+dir;
  if(j<0||j>=S.models.length) return;
  [S.models[i],S.models[j]]=[S.models[j],S.models[i]];
  render();
}
// score slider — a progress bar whose fill goes red (1) → yellow (5) → green (10)
function scoreColor(v){ const hue = v<=5 ? (v-1)/4*60 : 60+(v-5)/5*60; return "hsl("+hue+",70%,45%)"; }
function scoreFill(input){ const v=parseInt(input.value,10)||1; input.style.setProperty("--score-color",scoreColor(v)); const f=(v-1)/9; input.style.setProperty("--val",f); const W=input.clientWidth; if(W>0){ input.style.setProperty("--pos",(f*(W-18)+9)+"px"); } }
function refreshScoreFills(){ requestAnimationFrame(function(){ document.querySelectorAll("input.score").forEach(scoreFill); }); }
let _scoreResize=null; window.addEventListener("resize",function(){ if(_scoreResize)clearTimeout(_scoreResize); _scoreResize=setTimeout(refreshScoreFills,120); });
function scoreSlider(label, id, val, onChange, disabled){ const v=val||5; const s=el("input",{type:"range", id, min:"1", max:"10", value:String(v), class:"score"}); if(disabled) s.setAttribute("disabled",""); scoreFill(s); const valEl=el("span",{class:"score-val"}, String(v)); s.addEventListener("input",()=>{ scoreFill(s); valEl.textContent=s.value; if(onChange)onChange(parseInt(s.value,10)); }); return el("div",{class:"score-field"}, el("label",{},label), el("div",{class:"score-row"}, s, valEl)); }
// detect — call the probe endpoint, learn the provider, list the models + context lengths
async function detectModel(){ const m=S.modelDraft; if(!m.base_url){ S.formError="Enter the API base URL first."; render(); return; } S.formError=null; msg("Detecting "+m.base_url+"…",""); try{ const r=await api("POST","/setup/probe-model",{base_url:m.base_url, api_key:m.api_key}); m.provider=r.provider; m._models=r.models; S.detectedCache[normBase(m.base_url)]={provider:r.provider, models:r.models}; const avail=r.models.filter(mm=>!modelAlreadyAdded(mm.ID, m.base_url)); if(avail.length && !avail.some(x=>x.ID===m.model_id)){ m.model_id=avail[0].ID; if(avail[0].MaxContext){ m.max_context=String(avail[0].MaxContext); m.context_auto=true; } else { m.max_context=""; m.context_auto=false; } } msg("Detected "+r.provider+" — "+r.models.length+" model(s) found ("+avail.length+" not yet added).","ok"); render(); }catch(e){ S.formError="Detect failed: "+e.message+" — "+suggestedFix(e.message); render(); } }
function addAux(){ S.aux.push({modality:"vision",provider:"llama",base_url:"",api_key:"",model_id:""}); render(); }
function removeAux(i){ S.aux.splice(i,1); render(); }
async function testQdrant(){ msg("Testing Qdrant…",""); try{ const r=await api("POST","/setup/test-sidecar",{kind:"qdrant",endpoint:S.sidecars.qdrant}); msg(r.ok?"Qdrant reachable.":"Qdrant not reachable yet.","ok"); }catch(e){ msg("Error: "+e.message,"err"); } }
async function testLlama(){ msg("Testing llama-server…",""); try{ const r=await api("POST","/setup/test-sidecar",{kind:"llama-server",endpoint:S.sidecars.llama_server}); msg(r.ok?"llama-server reachable.":"llama-server not reachable yet.","ok"); }catch(e){ msg("Error: "+e.message,"err"); } }

// ---- nav ----
function sync(id, v){ /* handled by per-field listeners */ }
function render(){
  document.getElementById("body").innerHTML="";
  document.getElementById("body").append(RENDER[STEPS[idx]]());
  const st=document.getElementById("steps");
  if(IS_EDIT){ st.style.display="none"; } else { st.style.display=""; st.innerHTML="";
    STEPS.forEach((s,i)=>{ const e=el("span",{class:"step"+(i===idx?" active":""), text:s}); if(i<idx)e.classList.add("done"); st.append(e); }); }
  document.getElementById("finalize").classList.toggle("hidden", STEPS[idx]!=="review");
  document.getElementById("next").classList.toggle("hidden", STEPS[idx]==="review");
  refreshScoreFills();
}
async function api(method, path, body){ const url = IS_EDIT ? "/admin" + path : path; const opt={method}; if(body){opt.headers={"Content-Type":"application/json"}; opt.body=JSON.stringify(body);} const r=await fetch(url,opt); let j=null; try{j=await r.json();}catch(_){} if(!r.ok) throw new Error((j&&j.error)||("HTTP "+r.status)); return j; }
async function doNext(){
  const step=STEPS[idx];
  // gather per-step data from inputs into S (admin, embedder, sidecars via id-based reads)
  if(step==="admin"){ S.admin.handle=q("#ad_handle").value||q("#ad_handle").placeholder; S.admin.display_name=q("#ad_name").value||q("#ad_name").placeholder; S.admin.password=q("#ad_pw").value; if(q("#ad_pw").value!==q("#ad_pw2").value){msg("Passwords do not match","err");return;} }
  if(step==="embedder"){ S.embedder.base_url=q("#emb_base").value; }
  if(step==="sidecars"){ S.sidecars.qdrant=q("#sc_qdrant").value; S.sidecars.llama_server=q("#sc_llama").value; S.sidecars.ffmpeg=q("#sc_ffmpeg").value; }
  try{
    await api("POST","/setup/advance",{step, admin:S.admin, models:S.models, aux:S.aux, embedder:S.embedder, sidecars:S.sidecars});
    msg("");
    if(step==="review") return;
    idx=Math.min(idx+1, STEPS.length-1); render();
  }catch(e){ msg(e.message,"err"); }
}
async function doBack(){ if(idx>0){ idx--; try{ await api("POST","/setup/back",{step:STEPS[idx]}); }catch(_){} render(); } }
async function doCancel(){ if(confirm("Cancel setup? (In-memory state is discarded; sidecars already downloaded remain.)")){ await api("POST","/setup/cancel",{}); S={admin:{handle:"",display_name:"",password:""},models:[],aux:[],embedder:{base_url:""},sidecars:{qdrant:"",llama_server:"",ffmpeg:""}}; idx=0; msg("Setup cancelled — nothing written.","ok"); render(); } }
async function doFinalize(){ msg("Finalizing…",""); try{ const r=await api("POST","/setup/finalize",{}); if(IS_EDIT){ msg("Done — config saved; the agent will pick up the changes.","ok"); document.getElementById("body").innerHTML="<h3>Config updated</h3><p>Your model changes are saved. <a href='/'>Back to bevin</a></p>"; } else { msg("Done — open the login page.","ok"); document.getElementById("body").innerHTML="<h3>Setup complete</h3><p>Open <a href='/'>/</a> to log in as the admin you just created.</p>"; } document.getElementById("finalize").classList.add("hidden"); document.getElementById("next").classList.add("hidden"); document.getElementById("back").classList.add("hidden"); document.getElementById("cancel").classList.add("hidden"); }catch(e){ msg("Finalize failed: "+e.message,"err"); } }
function q(s){ return document.querySelector(s); }

document.getElementById("next").onclick=doNext;
document.getElementById("back").onclick=doBack;
document.getElementById("cancel").onclick=doCancel;
document.getElementById("finalize").onclick=doFinalize;
document.getElementById("themeToggle").addEventListener("click", function(){
  var root=document.documentElement;
  var next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("bevin-theme",next);}catch(e){}
});
render();
</script>
