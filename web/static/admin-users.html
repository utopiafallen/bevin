<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bevin — users</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/config-forms.css">
<script>
  (function(){try{var t=localStorage.getItem("bevin-theme");
    if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
    document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<script src="/config-forms.js"></script>
<style>
  /* page chrome (the form component styles live in config-forms.css) */
  body { max-width: 920px; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }
  .page-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin: .3rem 0 0; }
  .card { margin-top: 1rem; }
  .backlink { color: var(--brand-strong); font-weight: 700; text-decoration: none; }
  .backlink:hover { text-decoration: underline; }
  .model-table .badge { font-size:.7rem; font-weight:700; padding:.1rem .45rem; border-radius:999px; border:1px solid var(--border); }
  .model-table .badge.ok { color:var(--ok); border-color:var(--ok); }
  .model-table .badge.bad { color:var(--danger); border-color:var(--danger); }
  .model-table .badge.ext { color:var(--brand-strong); border-color:var(--brand-soft); background:var(--brand-softer); }
  .model-table .sub { display:block; font-size:.72rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
  <svg class="ico-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M20.5 7.5l-1.4 1.4M4.9 19.1l1.4-1.4"></path></svg>
  <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>
<div>
  <a class="brand" href="/admin"><img src="/logo-mark.svg" alt="bevin logo"> bevin</a>
  <div class="page-title">Users</div>
</div>
<p class="small"><a class="backlink" href="/admin">&larr; Back to the dashboard</a> &middot; Everyone bevin knows about — your own accounts (this server is always its own IdP) and the ones that sign in through the external provider.</p>

<div class="card">
  <div id="main"></div>
</div>
<div class="msg" id="msg"></div>

<script>
const PROBE_URL = "/admin/api/probe-model"; // unused here; the shared code references it
// Page state. _selfHandle = the signed-in admin (their row has no status
// control). _hasSecret = an OAuth client secret is stored (never returned).
let S = {
  selfHandle: "",
  users: [],
  oauth: { enabled:false, name:"", client_id:"", client_secret:"", auth_url:"", token_url:"", userinfo_url:"", scopes:"" },
  baseURI: "",
  _hasSecret: false,
};

async function api(method, path, body){ const opt={method}; if(body){opt.headers={"Content-Type":"application/json"}; opt.body=JSON.stringify(body);} const r=await fetch(path,opt); let j=null; try{j=await r.json();}catch(_){} if(!r.ok) throw new Error((j&&j.error)||("HTTP "+r.status)); return j; }
function msg(text, cls){ const m=document.getElementById("msg"); m.textContent=text||""; m.className="msg"+(cls?" "+cls:""); }
function esc(s){ const d=el("div",{}); d.textContent=s==null?"":String(s); return d.innerHTML; }

function render(){
  const main=document.getElementById("main");
  main.innerHTML="";
  renderUsersTable(main);
  renderAddUserForm(main);
  renderOauthSection(main);
}

function renderUsersTable(main){
  main.append(el("h3",{}, "All users"));
  main.append(el("p",{class:"small"},"Origin: <b>internal</b> = a bevin account with its own password (this server's own IdP); <b>OAuth</b> = created automatically from the external provider on first sign-in. Disabling a user stops both their sign-ins and their live sessions."));
  const t=el("table",{class:"model-table"});
  const thead=el("thead",{},el("tr",{},
    el("th",{},"Handle"), el("th",{},"Name"), el("th",{},"Role"), el("th",{},"Origin"), el("th",{},"Email"), el("th",{},"Status"), el("th",{},"")));
  t.append(thead);
  const tb=el("tbody",{});
  for(const u of S.users){
    const origin = u.idp==="oauth" ? el("span",{class:"badge ext"},"OAuth") : el("span",{},"internal");
    const status = u.status==="active" ? el("span",{class:"badge ok"},"active") : el("span",{class:"badge bad"},"disabled");
    const name=el("td",{},u.display_name);
    if(u.idp==="oauth" && u.idp_subject) name.append(el("span",{class:"sub"},"id: "+u.idp_subject));
    const actions=el("td",{});
    if(u.handle!==S.selfHandle){
      const b=el("button",{class:"row-btn"}, u.status==="active" ? "Disable" : "Enable");
      b.onclick=()=>setStatus(u.handle, u.status==="active"?"disabled":"active");
      actions.append(b);
    }
    tb.append(el("tr",{}, el("td",{},u.handle), name, el("td",{},u.role), el("td",{},origin), el("td",{},u.email||"—"), el("td",{},status), actions));
  }
  t.append(tb);
  main.append(t);
}

function renderAddUserForm(main){
  const d=el("div",{style:"margin-top:1.2rem"});
  d.append(el("h3",{}, "Add a user (internal)"));
  d.append(el("p",{class:"small"},"Create an account on this server's own IdP — separate from the external provider (users you enable THERE sign in through OAuth and get created automatically; they never appear here until their first login)."));
  const handle=inp("nu_handle","","alice");
  const name=inp("nu_name","","Alice Example");
  const pw=el("input",{id:"nu_pw", type:"password", placeholder:"password (min 8 chars)"});
  d.append(el("div",{class:"row"}, field("Handle", handle), field("Display name", name), field("Password", pw)));
  const btn=el("button",{class:"primary"},"Add user");
  btn.onclick=async function(){
    try{
      await api("POST","/admin/api/users",{handle:handle.value, display_name:name.value, password:pw.value});
      handle.value=""; name.value=""; pw.value="";
      msg("User added.","ok");
      await refreshUsers();
    }catch(err){ msg("Add failed: "+err.message,"err"); }
  };
  d.append(el("div",{class:"btns", style:"margin-top:.6rem"}, btn));
  main.append(d);
}

function renderOauthSection(main){
  const o=S.oauth;
  const d=el("div",{style:"margin-top:1.2rem"});
  main.append(d);
  d.append(el("h3",{}, "External sign-in (OAuth)"));
  d.append(el("p",{class:"small"},"bevin is always its own IdP (the accounts above). Enable an external provider (authentik, Keycloak, Google — anything with an authorization-code + user-info flow) alongside it: users you enable in the provider sign in through it, and bevin creates their account automatically on first login — no need to add them here."));
  const en=el("div",{class:"yesno"});
  const yesB=el("button",{type:"button", class:o.enabled?"sel":""}, "Yes");
  const noB=el("button",{type:"button", class:!o.enabled?"sel":""}, "No");
  yesB.addEventListener("click",()=>{ o.enabled=true; render(); });
  noB.addEventListener("click",()=>{ o.enabled=false; render(); });
  en.append(yesB,noB);
  d.append(field("Enable external sign-in (OAuth)", en));
  if(!o.enabled){
    d.append(el("p",{class:"small"},"OAuth is off — bevin accepts its own logins only."));
    return;
  }
  const nameI=inp("oa_name", o.name, "shown on the sign-in button, e.g. authentik");
  const cidI=inp("oa_clientid", o.client_id, "the OAuth app's client id");
  const csI=inp("oa_clientsecret", o.client_secret, S._hasSecret?"saved — leave blank to keep":"the OAuth app's client secret");
  const auI=inp("oa_authurl", o.auth_url, "https://idp.example.com/application/o/authorize/");
  const tuI=inp("oa_tokenurl", o.token_url, "https://idp.example.com/application/o/token/");
  const uuI=inp("oa_userinfourl", o.userinfo_url, "https://idp.example.com/application/o/user/");
  const scI=inp("oa_scopes", o.scopes, "openid profile email");
  const ruOut=inp("oa_redirectderived","",""); ruOut.readOnly=true;
  nameI.addEventListener("input",()=>{ o.name=nameI.value; });
  cidI.addEventListener("input",()=>{ o.client_id=cidI.value; });
  csI.addEventListener("input",()=>{ o.client_secret=csI.value; });
  auI.addEventListener("input",()=>{ o.auth_url=auI.value; });
  tuI.addEventListener("input",()=>{ o.token_url=tuI.value; });
  uuI.addEventListener("input",()=>{ o.userinfo_url=uuI.value; });
  scI.addEventListener("input",()=>{ o.scopes=scI.value; });
  const svBase=(S.baseURI||"").trim().replace(/\/+$/,"");
  ruOut.value = svBase ? svBase+"/auth/oauth/callback" : "";
  ruOut.placeholder = svBase ? "" : "set the public base URI on the Server page";
  d.append(field("Provider name", nameI));
  d.append(el("div",{class:"row"}, field("Client ID", cidI), field("Client secret", csI)));
  d.append(field("Authorization URL", auI));
  d.append(field("Token URL", tuI));
  d.append(field("User-info URL", uuI));
  d.append(field("Scopes", scI));
  d.append(field("Redirect URI — paste this into the OAuth app registration", ruOut));
  d.append(el("p",{class:"small"},"The public base URI is set on the SERVER page (the address of this instance behind the reverse proxy, so https). Bevin derives the redirect URI from it (base + /auth/oauth/callback) and sends it to the provider — the provider's identity maps to a handle from preferred_username (else the email's local part, else the subject)."));
  const save=el("button",{class:"primary"},"Save OAuth settings");
  save.onclick=async function(){
    try{
      const body=JSON.parse(JSON.stringify(o));
      const r=await api("POST","/admin/api/config",{oauth:body});
      if(o.client_secret){ o.client_secret=""; S._hasSecret=true; }
      render();
      msg(r.reloaded ? "Saved — external sign-in changes apply immediately." : "Saved (the agent reload failed — restart bevin to apply).", r.reloaded?"ok":"err");
    }catch(err){ msg("Save failed: "+err.message,"err"); }
  };
  d.append(el("div",{class:"btns", style:"margin-top:.6rem"}, save));
}

async function setStatus(handle, status){
  try{
    await api("POST","/admin/api/users/status",{handle, status});
    msg((status==="disabled"?"Disabled":"Enabled")+" "+handle+".","ok");
    await refreshUsers();
  }catch(err){ msg("Change failed: "+err.message,"err"); }
}

async function refreshUsers(){
  try{
    const d=await api("GET","/admin/api/users");
    S.users=d.users||[];
    render();
  }catch(err){ msg("Could not load users: "+err.message,"err"); }
}

// Load the config (the oauth area) + the session's own handle, then the users.
(async function(){
  try{
    const d=await api("GET","/admin/api/config");
    const o=d.oauth||{};
    S.oauth={
      enabled: !!o.enabled,
      name: o.name||"",
      client_id: o.client_id||"",
      client_secret: "",
      auth_url: o.auth_url||"",
      token_url: o.token_url||"",
      userinfo_url: o.userinfo_url||"",
      scopes: o.scopes||"",
    };
    S.baseURI=(d.server&&d.server.base_uri)||"";
    S._hasSecret=!!o.has_secret;
  }catch(err){ msg("Could not load the config: "+err.message,"err"); }
  try{ const me=await api("GET","/api/me"); S.selfHandle=me.handle||""; }catch(_){}
  await refreshUsers();
  if(S.users.length===0) render();
})();

document.getElementById("themeToggle").addEventListener("click", function(){
  var root=document.documentElement;
  var next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("bevin-theme",next);}catch(e){}
});
</script>
</body>
</html>
