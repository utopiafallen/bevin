<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bevin — admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<!-- The model/aux editor components are shared with the setup wizard; the
     Models page inlines them (see the editor state in the script below). -->
<link rel="stylesheet" href="/config-forms.css">
<script src="/config-forms.js"></script>
<style>
  body { display:flex; min-height:100vh; margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  .side { width:220px; flex:0 0 220px; background:var(--surface); border-right:1px solid var(--border); padding:1.2rem .9rem; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .side .logo { display:flex; align-items:center; gap:.55rem; font-weight:900; font-size:1.05rem; padding:.2rem .5rem .9rem; }
  .side .logo img { width:30px; height:30px; }
  .side .admin-tag { font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--brand-strong); background:var(--brand-softer); border-radius:var(--radius-pill); padding:.18rem .6rem; display:inline-block; margin:0 0 1rem .5rem; }
  .nav { display:flex; flex-direction:column; gap:.15rem; }
  .nav a { display:flex; align-items:center; gap:.55rem; padding:.55rem .7rem; border-radius:10px; color:var(--text); text-decoration:none; font-size:.92rem; font-weight:700; }
  .nav a:hover { background:var(--surface-2); }
  .nav a.active { background:var(--brand-soft); color:var(--brand-strong); }
  .nav a .ic { width:1.2em; text-align:center; }
  .side .foot { margin-top:auto; padding:.7rem .5rem 0; border-top:1px solid var(--border); font-size:.85rem; }
  .side .foot a { color:var(--accent-strong); text-decoration:none; font-weight:700; }
  .main { flex:1; padding:1.6rem 2rem 3rem; max-width:1000px; }
  .main h1 { font-size:1.35rem; margin:.2rem 0 1rem; }
  .main h2 { font-size:1rem; margin:1.4rem 0 .6rem; color:var(--brand-strong); text-transform:uppercase; letter-spacing:.04em; font-size:.8rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.2rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; }
  .totals { display:flex; gap:1.6rem; font-size:.95rem; }
  .totals b { font-size:1.5rem; display:block; }
  .pool { padding:.7rem 0; border-bottom:1px solid var(--border); }
  .pool:last-child { border-bottom:0; }
  .pool-head { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.45rem; }
  .pool-name { font-weight:800; }
  .pool-prov { color:var(--text-muted); font-size:.8rem; }
  .pool-state { margin-left:auto; font-size:.85rem; font-weight:700; color:var(--text-muted); }
  .slots { display:flex; gap:.35rem; }
  .slot { flex:1; height:14px; border-radius:5px; background:var(--surface-2); border:1px solid var(--border); }
  .slot.busy { background:var(--brand); border-color:var(--brand-hover); }
  .util { height:5px; border-radius:3px; background:var(--surface-2); margin-top:.4rem; overflow:hidden; }
  .util i { display:block; height:100%; background:var(--brand); border-radius:3px; }
  .util i.warn { background:#d97706; }
  .util i.danger { background: var(--danger); }
  .cont-spin { display:inline-block; width:13px; height:13px; border:2px solid var(--surface-2); border-top-color: var(--brand); border-radius:50%; animation: contspin .7s linear infinite; vertical-align:-2px; flex:0 0 auto; }
  @keyframes contspin { to { transform: rotate(360deg); } }
  table.q { width:100%; border-collapse:collapse; font-size:.9rem; }
  table.q th { text-align:left; color:var(--text-muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; padding:.3rem .5rem; }
  table.q td { padding:.45rem .5rem; border-top:1px solid var(--border); }
  .empty { color:var(--text-muted); font-size:.9rem; padding:.4rem 0; }
  .badge { font-size:.7rem; font-weight:800; border-radius:var(--radius-pill); padding:.15rem .55rem; }
  .badge.ok { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .badge.bad { background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); }
  .btn { display:inline-block; background:var(--brand); color:var(--brand-contrast); font:inherit; font-weight:800; border:0; border-radius:var(--radius-pill); padding:.55rem 1.2rem; cursor:pointer; text-decoration:none; }
  .btn:hover { background:var(--brand-hover); }
  .btn.ghost { background:transparent; color:var(--brand-strong); border:1px solid var(--border); }
  .row { display:flex; gap:.6rem; align-items:center; }
  .row input[type=text] { flex:1; font:inherit; padding:.5rem .8rem; border:1px solid var(--border); border-radius:10px; background:var(--surface); }
  .kv { font-family:var(--font-mono); font-size:.85rem; word-break:break-all; }
  .muted { color:var(--text-muted); font-size:.88rem; }
  .msg { font-size:.9rem; margin-top:.5rem; min-height:1.2em; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--danger); }
  .blocked { text-align:center; padding:4rem 1rem; }
  .blocked .btn { margin-top:1rem; }
  .toolbar { display:flex; gap:.6rem; align-items:center; margin:.4rem 0 1rem; }
  .page-note { color:var(--text-muted); font-size:.85rem; margin:.2rem 0 .6rem; }
  .row-actions { display:flex; gap:.35rem; }
  .row-actions .row-btn:disabled { opacity:.4; cursor:not-allowed; }
  /* Users page (inlined): the origin/status badges + the per-row button (the
     shared .row-btn visual is scoped to the model list, so the users table
     carries its own copy) + the three-column form row. */
  .badge.ext { background:var(--brand-softer); color:var(--brand-strong); }
  .sub { display:block; font-size:.72rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
  .row-actions .row-btn { font:inherit; font-size:.75rem; font-weight:700; padding:.22rem .55rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); cursor:pointer; }
  .row-actions .row-btn:hover { background:var(--surface-2); }
  .users-frow { display:flex; gap:.6rem; flex-wrap:wrap; }
  .users-frow > div { flex:1; min-width:160px; }
</style>
</head>
<body>
  <nav class="side">
    <div class="logo"><img src="/logo-mark.svg" alt="">bevin</div>
    <span class="admin-tag">admin</span>
    <div class="nav" id="nav">
      <a href="#overview" data-page="overview"><span class="ic">▦</span>Overview</a>
      <a href="#models" data-page="models"><span class="ic">◍</span>Models</a>
      <a href="#tools" data-page="tools"><span class="ic">⌕</span>Tools</a>
      <a href="#sidecars" data-page="sidecars"><span class="ic">⬡</span>Sidecars</a>
      <a href="#email" data-page="email"><span class="ic">✉</span>Email</a>
      <a href="#users" data-page="users"><span class="ic">☻</span>Users</a>
      <a href="#containers" data-page="containers"><span class="ic">▣</span>Containers</a>
      <a href="#server" data-page="server"><span class="ic">⚙</span>Server</a>
    </div>
    <div class="foot"><a href="#" id="signout">Sign out</a></div>
  </nav>
  <main class="main" id="main"></main>
<script>
let STATUS = null, SIDE = null, ME = null, USERS = null, OAUTH = null, OAUTH_ERR = null, OAUTH_HAS_SECRET = false, BASE_URI = "", TOOLS = null, EMAIL = null, EMAIL_ORIG = null;
let pollTimer = null;

async function j(url, opt) {
  const r = await fetch(url, opt || {});
  let body = null; try { body = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((body && body.error) || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return body;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function locTime(iso) { try { return new Date(iso).toLocaleString(); } catch (_) { return iso; } }

function page() { return (location.hash || "#overview").slice(1) || "overview"; }
function renderNav() {
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.page === page()));
}
window.addEventListener("hashchange", () => { renderNav(); stopPoll(); render(); });

function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function startPoll(fn, ms) { stopPoll(); fn(); pollTimer = setInterval(fn, ms); }

async function boot() {
  try { ME = await j("/api/me"); } catch (e) { return blocked(e); }
  render();
}
function blocked(e) {
  const m = document.getElementById("main");
  m.innerHTML = "";
  const d = document.createElement("div");
  d.className = "blocked";
  d.innerHTML = "<h1>Admin required</h1><p class='muted'>" + esc(e.message) + "</p>";
  const b = document.createElement("a");
  b.className = "btn"; b.href = "/"; b.textContent = "Go to login";
  d.append(b);
  m.append(d);
  stopPoll();
}

async function loadStatus() {
  try { STATUS = await j("/admin/api/status"); } catch (e) { return blocked(e); }
  // Re-render whichever STATUS-backed page is showing once the status
  // arrives. A page opened BEFORE the first status landed (e.g. a refresh
  // straight onto #server) would otherwise sit on its "Loading…" forever —
  // the status is a fast in-memory GET, so there is nothing to spin on,
  // just a missed re-render.
  if (page() === "overview") renderOverview();
  else if (page() === "server") renderServer();
}
async function loadSide() {
  try { SIDE = await j("/admin/api/sidecars"); } catch (e) { return blocked(e); }
  if (page() === "sidecars") renderSidecars();
}
async function loadMail() {
  // The email page consumes the config read's email area (the prefill
  // values + has_password — the stored password is never returned). Seed
  // S.email ONLY on the first load: the shared form's toggle re-renders
  // call the page's render(), which re-fetches through here, and those
  // must never clobber in-flight edits.
  try { EMAIL = (await j("/admin/api/config")).email; } catch (e) { return blocked(e); }
  if (!S.email._loaded) seedEmailFrom(EMAIL);
  if (page() === "email") renderEmail();
}
// seedEmailFrom — build the form state from a fetched (saved) config email
// area. The password is never among them (masked), so the field starts
// blank; _hasPassword drives the "leave blank to keep" placeholder.
// EMAIL_ORIG (what Cancel restores) is the saved state, deep-copied.
function seedEmailFrom(e) {
  e = e || {};
  S.email = {
    enabled: !!e.enabled,
    smtp_host: e.smtp_host || "",
    smtp_port: e.smtp_port ? String(e.smtp_port) : "",
    username: e.username || "",
    password: "",
    from_address: e.from_address || "",
    from_name: e.from_name || "",
    use_starttls: e.use_starttls !== false,
    _hasPassword: !!e.has_password,
    _loaded: true,
  };
  EMAIL_ORIG = deepCopy(S.email);
}
// saveEmail — persist the email area (a blank password keeps the stored
// one, server-side). Then re-fetch and re-seed: the saved config is the
// normalized current state (the server fills blanks — port 587, from_name
// "bevin", from_address ← username — so the re-fetched values, not the
// form's, are what "current" and Cancel now mean).
async function saveEmail() {
  try {
    const e = Object.assign({}, S.email);
    delete e._hasPassword; delete e._loaded;
    const r = await j("/admin/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: e }) });
    const d = await j("/admin/api/config");
    EMAIL = d.email;
    seedEmailFrom(EMAIL);
    renderEmail();
    msg(r.reloaded ? "Saved — the email settings apply immediately." : "Saved (the agent reload failed — restart bevin to apply).", r.reloaded ? "ok" : "err");
  } catch (err) {
    msg("Save failed: " + err.message, "err");
  }
}
// cancelEmail — the admin panel's addition to the shared form: undo the
// edits in the form (client-side only — nothing was committed, so there
// is nothing to roll back server-side) and show the saved settings.
function cancelEmail() {
  if (!EMAIL_ORIG) return;
  S.email = deepCopy(EMAIL_ORIG);
  renderEmail();
  msg("Changes discarded — showing the saved settings.", "");
}
async function loadTools() {
  // The config read is the same endpoint every config page uses; this page
  // only consumes its tools area (the masked web_search settings + the
  // build's provider list).
  try { TOOLS = (await j("/admin/api/config")).tools; } catch (e) { return blocked(e); }
  if (page() === "tools") renderTools();
}

function render() {
  renderNav();
  stopPoll();
  const m = document.getElementById("main");
  m.innerHTML = "";
  switch (page()) {
    case "overview": renderOverview(); startPoll(loadStatus, 2000); break;
    case "models": renderModels(); loadModelEditor(); break;
    case "tools": renderTools(); loadTools(); break;
    case "sidecars": renderSidecars(); startPoll(loadSide, 5000); break;
    case "email": renderEmail(); loadMail(); loadSide(); break;
    case "users": renderUsers(); loadUsers(); break;
    case "containers": renderContainers(); startPoll(loadContainers, 10000); break;
    case "server": renderServer(); loadStatus(); break;
    default: renderOverview(); startPoll(loadStatus, 2000);
  }
}

function renderOverview() {
  const m = document.getElementById("main");
  m.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = "Overview"; m.append(h);
  if (!STATUS) { m.append(elP("Loading…")); return; }
  // Totals.
  const tot = document.createElement("div");
  tot.className = "card totals";
  tot.innerHTML =
    "<div><b>" + STATUS.totals.slots + "</b>execution slots</div>" +
    "<div><b>" + STATUS.totals.busy + "</b>busy now</div>" +
    "<div><b>" + STATUS.totals.queued + "</b>queued (global task queue)</div>" +
    "<div><b>" + esc(locTime(STATUS.time)) + "</b>now</div>";
  m.append(tot);
  // Pools.
  const pools = document.createElement("div");
  pools.className = "card";
  pools.innerHTML = "<h2>Execution-slot pools</h2>";
  if (!STATUS.pools.length) pools.append(elP("No models configured."));
  STATUS.pools.forEach(p => pools.append(poolRow(p)));
  m.append(pools);
  // Queue.
  const q = document.createElement("div");
  q.className = "card";
  q.innerHTML = "<h2>Global task queue</h2>";
  const waiting = [];
  STATUS.pools.forEach(p => p.waiting.forEach(w => waiting.push(Object.assign({ pool: p.display_name || p.id }, w))));
  if (!waiting.length) q.append(elP("Queue is empty — every turn has a slot."));
  else {
    const t = document.createElement("table");
    t.className = "q";
    t.innerHTML = "<tr><th>User</th><th>Model pool</th><th>Conversation</th><th>Waiting</th></tr>";
    waiting.forEach(w => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + esc(w.handle) + "</td><td>" + esc(w.pool) + "</td><td class='kv'>" + esc(w.conversation_id) + "</td><td>" + w.wait_secs + "s</td>";
      t.append(tr);
    });
    q.append(t);
  }
  m.append(q);
}

function poolRow(p) {
  const d = document.createElement("div");
  d.className = "pool";
  const blocks = [];
  for (let i = 0; i < p.slots; i++) blocks.push("<div class='slot" + (i < p.busy ? " busy" : "") + "'></div>");
  const pct = p.slots ? Math.round(100 * p.busy / p.slots) : 0;
  let state = p.busy + "/" + p.slots + " slots";
  if (p.auto_disabled) state += " — unavailable (auto-disabled)";
  else if (!p.enabled) state += " — disabled";
  if (p.auxes && p.auxes.length) state += " · perception: " + p.auxes.join(", ");
  d.innerHTML =
    "<div class='pool-head'><span class='pool-name'>" + esc(p.display_name || p.id) + "</span>" +
    "<span class='pool-prov'>" + esc(p.provider) + (p.aux ? " · perception" : "") + "</span>" +
    "<span class='pool-state'>" + esc(state) + "</span></div>" +
    "<div class='slots'>" + blocks.join("") + "</div>" +
    "<div class='util'><i style='width:" + pct + "%'></i></div>";
  return d;
}

// ---- Models editor (inlined on this page) ----
// The model/aux form components are SHARED with the setup wizard
// (config-forms.js, loaded in the head). This page is a thin consumer: it
// provides the state object S, api(), render(), the #msg element, the
// endpoint constants, a no-op sync() (inp() calls it on every keystroke),
// and onConfigChanged (per-action save to /admin/api/config — the wizard
// leaves the hook unset and persists at step advance). The editor is INLINE
// on the dashboard's Models page (no detour to a dedicated page —
// /admin/models redirects here): "Add model" / "Add aux" are their own
// buttons, each opening its form (nothing commits until the form's Add /
// Save changes button is pressed — the form has an explicit Cancel), and a
// specific model is edited from its row's Edit button in its table (the
// shared editModel / the page-local editAuxModel load it into the form;
// while editing, the row is spliced out of the table and comes back on
// save). Both model kinds are LIST-CENTRIC tables; the forms are
// on-demand (hidden by default), and only one form is open at a time.
const PROBE_URL = "/admin/api/probe-model";
const EMAIL_TEST_URL = "/admin/api/email/test"; // the Email page's shared form tests the draft against it
const PROFILES_URL = "/admin/api/profiles"; // the build's model profile registry (the profile selects' options)
let S = { models: [], modelDraft: freshModel(), editingIndex: -1, editOriginal: null, formError: null, aux: [], showForm: false, loaded: false, auxDraft: freshAux(), auxEditingIndex: -1, auxEditOriginal: null, auxFormError: null, auxShowForm: false, email: { enabled: false, smtp_host: "", smtp_port: "", username: "", password: "", from_address: "", from_name: "", use_starttls: true } };

// api — the fetch helper the shared components expect (parsed JSON; throws
// with the server's error message on a non-2xx).
async function api(method, path, body) { const opt = { method }; if (body) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); } const r = await fetch(path, opt); let j = null; try { j = await r.json(); } catch (_) {} if (!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status)); return j; }
// sync — the per-field keystroke hook config-forms.js's inp() invokes; the
// per-field listeners sync the draft themselves, so this is a no-op (same
// contract as the setup wizard).
function sync(id, v) { /* handled by per-field listeners */ }

// stripWorking — drop the per-draft working state (_models / _detecting /
// _lastBase) before a payload crosses the wire (same rule as the wizard).
function stripWorking(o) { if (!o || typeof o !== "object") return o; if (Array.isArray(o)) return o.map(stripWorking); const c = {}; for (const k of Object.keys(o)) if (!k.startsWith("_")) c[k] = o[k]; return c; }

// commit — persist the current models + aux (per action, via the shared
// components' onConfigChanged hook). A single in-flight guard: rapid actions
// (e.g. reorder) queue at most one follow-up.
let _committing = false, _commitPending = false;
async function commit(area) {
  if (_committing) { _commitPending = true; return; }
  _committing = true;
  try {
    const r = await api("POST", "/admin/api/config", { models: stripWorking(S.models), aux: stripWorking(S.aux) });
    msg(r.reloaded ? "Saved — the running agent picked up the changes." : "Saved (the agent reload failed — restart bevin to apply).", r.reloaded ? "ok" : "err");
  } catch (e) {
    msg("Save failed: " + e.message, "err");
  } finally {
    _committing = false;
    if (_commitPending) { _commitPending = false; commit(area); }
  }
}
window.onConfigChanged = function (area) { commit(area); };

// loadModelEditor — fetch the saved models + aux ONCE (disk is the commit of
// record; after that S is the source of truth and re-renders never re-fetch
// — a re-render under the admin's hands would paint the form mid-edit). The
// profile catalog (the profile selects' options) loads with it.
let _modelsLoading = false;
async function loadModelEditor() {
  if (S.loaded || _modelsLoading) return;
  _modelsLoading = true;
  try {
    const d = await api("GET", "/admin/api/config");
    S.models = d.models || [];
    S.aux = d.aux || [];
  } catch (e) { msg("Could not load the config: " + e.message, "err"); }
  S.loaded = true;
  render();
  loadProfiles().then(render);
}

function modelFormVisible() { return (S.showForm || S.editingIndex !== -1) && !auxFormVisible(); }
function auxFormVisible() { return S.auxShowForm || S.auxEditingIndex !== -1; }
function scrollToModelForm() { const e = document.getElementById("mf_base"); if (e) e.scrollIntoView({ behavior: "smooth", block: "center" }); }
function scrollToAuxForm() { const e = document.getElementById("auxf_base"); if (e) e.scrollIntoView({ behavior: "smooth", block: "center" }); }

// ---- Aux form (page-local) ----
// The setup wizard keeps the shared inline-card aux flow (renderAuxSection);
// the dashboard lists aux models in a table and edits them through this
// on-demand form — the same draft/edit pattern as the main-model form:
// "Add aux" opens a blank draft, a row's Edit loads that aux (spliced out of
// the table while editing, restored on cancel). Nothing commits until the
// form's primary button (Add / Save changes) is pressed; Cancel discards.
function resetAuxDraft() { S.auxDraft = freshAux(); S.auxEditingIndex = -1; S.auxEditOriginal = null; S.auxFormError = null; }
// closeAuxForm — discard the open aux form: restore the original row when
// editing (it was spliced out), reset the draft, hide the form. The callers
// render() themselves (cancelAuxEdit is the form's Cancel button and does).
function closeAuxForm() {
  if (S.auxEditingIndex !== -1 && S.auxEditOriginal) {
    const idx = Math.min(S.auxEditingIndex, S.aux.length);
    S.aux.splice(idx, 0, S.auxEditOriginal);
  }
  resetAuxDraft();
  S.auxShowForm = false;
}
function cancelAuxEdit() { closeAuxForm(); render(); }
function editAuxModel(i) {
  S.auxEditOriginal = deepCopy(S.aux[i]);
  S.auxDraft = deepCopy(S.aux[i]);
  S.auxEditingIndex = i; S.aux.splice(i, 1); S.auxFormError = null;
  if (S.editingIndex !== -1) cancelEdit(); else resetDraft();
  S.auxShowForm = true; S.showForm = false;
  render();
  scrollToAuxForm();
}
// detectAuxDraft — probe the provider for the AUX DRAFT (not a stored aux
// entry): mirror of the shared detectAux, bound to S.auxDraft.
async function detectAuxDraft() {
  const m = S.auxDraft;
  if (m._detecting) return;
  if (!m.base_url) { S.auxFormError = "Enter the API base URL first."; render(); return; }
  m._detecting = true; S.auxFormError = null; msg("Detecting " + m.base_url + "…", ""); render();
  try {
    const r = await probeDraft(m);
    if (r.base_url) { m.base_url = r.base_url; }
    applyAuxFields(m, r.models, -1);
    msg("Detected " + r.provider + " — " + r.models.length + " model(s) found.", "ok");
  } catch (e) { S.auxFormError = "Detect failed: " + e.message + " — " + suggestedFix(e.message); }
  finally { m._detecting = false; render(); }
}
function saveAuxModel() {
  const m = S.auxDraft;
  if (!m.base_url) { S.auxFormError = "Base URL is required."; render(); return; }
  if (!m.model_id) { S.auxFormError = "Pick a model — press Detect to list the provider's models."; render(); return; }

async function loadUsers() {
  if (!USERS) {
    try { const d = await api("GET", "/admin/api/users"); USERS = d.users || []; }
    catch (e) { if (page() === "users") msg("Could not load users: " + e.message, "err"); }
  }
  if (!OAUTH && !OAUTH_ERR) {
    try {
      const d = await api("GET", "/admin/api/config");

    const o = document.createElement("option");
    o.value = p;
    o.textContent = labels[p] || p;
    if ((ws.provider || "exa") === p) o.selected = true;
    psel.append(o);
  });
  c.append(psel);
  const kl = document.createElement("label"); kl.textContent = "API key"; c.append(kl);
  const k = document.createElement("input");
  k.type = "password";
  k.autocomplete = "new-password";
  k.placeholder = ws.has_api_key ? "saved — leave blank to keep" : "your provider API key";
  c.append(k);
  c.append(elP("The key is stored in server.toml (mode 0600) and never returned by the API — leaving the field blank keeps the stored key. Get an Exa key at https://dashboard.exa.ai/api-keys."));
  const save = document.createElement("button");
  save.className = "btn";
  save.textContent = "Save";
  save.onclick = async () => {
    save.disabled = true;
    try {
      const r = await j("/admin/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tools: { web_search: { enabled, provider: psel.value, api_key: k.value.trim() } } }) });
      await loadTools();
      msg(r.reloaded ? "Saved — web search changes apply from the next turn." : "Saved (the agent reload failed — restart bevin to apply).", r.reloaded ? "ok" : "err");
    } catch (e) {
      msg("Save failed: " + e.message, "err");
      save.disabled = false;
    }
  };
  c.append(save);
  m.append(c);
}

function renderServer() {
  const m = document.getElementById("main");
  m.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = "Server"; m.append(h);
  const msgEl = document.createElement("div"); msgEl.className = "msg"; msgEl.id = "msg"; m.append(msgEl);
  const c = document.createElement("div");
  c.className = "card";
  if (!STATUS) { c.append(elP("Loading…")); m.append(c); return; }
  c.innerHTML =
    "<h2>Basics</h2>" +
    "<p class='kv'>data dir " + esc(STATUS.server.data_dir) + "<br>bind " + esc(STATUS.server.bind) + "</p>" +
    "<p class='muted'>The listen port is set via the CLI (-port) and is not stored in the config.</p>";
  m.append(c);

  // Public base URI — the one server-level value bevin can't derive itself.
  // Every link the system generates for the outside world (the OAuth
  // redirect, password-reset / notification links as they land) comes from
  // it, so it lives here, at the server level, not under OAuth.
  const c2 = document.createElement("div");
  c2.className = "card";
  c2.innerHTML = "<h2>Public base URI</h2>";
  const label = document.createElement("label");
  label.textContent = "Base URI";
  c2.append(label);
  const input = document.createElement("input");
  input.type = "text";
  input.value = STATUS.server.base_uri || "";
  input.placeholder = "https://bevin.example.com";
  c2.append(input);
  c2.append(elP("The PUBLIC address of this instance behind your reverse proxy (https, with a subpath if bevin is served under one, e.g. https://bevin.example.com/bevin). Leave blank only for a local-only setup — it is required while external sign-in (OAuth) is enabled, because the redirect URI is derived from it."));
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = "Save base URI";
  btn.onclick = async () => {
    const v = input.value.trim();
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const r = await j("/admin/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ server: { base_uri: v } }) });
      await loadStatus(); // refresh STATUS (re-renders this page)
      msg(r.reloaded ? "Saved — applies immediately." : "Saved (the agent reload failed — restart bevin to apply).", r.reloaded ? "ok" : "err");
    } catch (e) {
      msg("Save failed: " + e.message, "err");
      btn.disabled = false; btn.textContent = "Save base URI";
    }
  };
  c2.append(btn);
  m.append(c2);

  // Web push (the PWA stage 2): the server's VAPID pair. Keys present =
  // on (there is no enable flag). Generated HERE, server-side — the
  // private key never transits the admin UI.
  const c3 = document.createElement("div");
  c3.className = "card";
  c3.innerHTML = "<h2>Web push</h2>";
  c3.append(elP("Notifications for the installed PWA: an interactive turn completing (or failing), a task going done/blocked, and system events (restart, disk unfreeze). Devices subscribe per user; the subscription is the delivery gate — there is no separate enable flag."));
  const pushStatusEl = document.createElement("div");
  pushStatusEl.className = "kv";
  pushStatusEl.textContent = "Loading…";
  c3.append(pushStatusEl);
  const genBtn = document.createElement("button");
  genBtn.className = "btn";
  genBtn.style.marginTop = "8px";
  genBtn.textContent = "Generate VAPID keys";
  genBtn.onclick = async () => {
    if (!confirm("Generate a new VAPID key pair? Devices with existing subscriptions are pruned on their next push — they re-subscribe against the new key on their next standalone launch.")) return;
    genBtn.disabled = true; genBtn.textContent = "Generating…";
    try {
      await j("/admin/api/push/keys", { method: "POST" });
      msg("Web push keys generated — push can send now.", "ok");
      const cfg = await j("/admin/api/config");
      pushStatusEl.textContent = (cfg.push && cfg.push.configured) ? "Configured — web push can send." : "Not configured.";
      genBtn.textContent = "Rotate VAPID keys";
    } catch (e) {
      msg("Keygen failed: " + e.message, "err");
      genBtn.disabled = false; genBtn.textContent = "Generate VAPID keys";
    }
  };
  c3.append(genBtn);
  j("/admin/api/config").then((cfg) => {
    if (cfg.push) {
      pushStatusEl.textContent = cfg.push.configured ? "Configured — web push can send." : "Not configured — web push is off.";
      if (cfg.push.configured) genBtn.textContent = "Rotate VAPID keys";
    } else {
      pushStatusEl.textContent = "Not configured — web push is off.";
    }
  }).catch(() => { pushStatusEl.textContent = "Not configured — web push is off."; });
  m.append(c3);
}

// ---- Containers (inlined on this page) ----
// The dedicated container admin panel: the live per-environment health
// dashboard (state + CPU/RAM/disk usage) + the per-container resource caps
// (moved here from the Server page) + the restart-to-apply action. The
// dashboard auto-refreshes every 10s; the cap form is rendered once and a
// poll updates only the dashboard in place (never clobbering an in-progress
// edit).
let CONTAINERS = null;   // { limits: {cores, memory_mb, disk_mb}, runtime_ok, runtime_detail, containers: [...] }
const _cpuPrev = {};     // handle -> { sec, ts } (the previous poll, for the live CPU %)
let _contFetching = true; // true while a /admin/api/containers fetch is in flight (the loading state)

async function loadContainers() {
  _contFetching = true;
  if (page() === "containers") updateContStatus(); // show "querying…" at once
  try {
    CONTAINERS = await j("/admin/api/containers");
    CONTAINERS.loaded_at = Date.now();
  } catch (_) { _contFetching = false; return; } // a poll hiccup is not fatal
  _contFetching = false;
  if (page() !== "containers") return;
  // First load (the card's body shows "querying") → update in place; the poll
  // updates only the dashboard, never re-rendering the cap form.
  renderDashboard();
  updateContStatus(); // "updated <time>"
}

function renderContainers() {
  const m = document.getElementById("main");
  m.innerHTML = "";
  const h = document.createElement("h1"); h.textContent = "Containers"; m.append(h);
  const note = document.createElement("p");
  note.className = "page-note";
  note.textContent = "Every user's environment + the per-container resource caps. Saving CPU or RAM restarts the running environments (their users are emailed to check in-flight work); the disk cap applies immediately.";
  m.append(note);
  const msgEl = document.createElement("div"); msgEl.className = "msg"; msgEl.id = "msg"; m.append(msgEl);
  // The dashboard card carries its own loading state (a spinner + "querying…")
  // in its body, so it is always created — even before the first fetch lands.
  m.append(renderContainerDash());
  m.append(renderLimitsCard());
}

// renderContainerDash — the health dashboard card: a per-environment table
// (state + CPU + RAM + disk) + a "Restart all" action + a live status line
// (querying… / updated <time>). The div#cont-dash-body is the part the poll
// re-renders in place.
function renderContainerDash() {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = "<h2>Environments</h2>";
  const bar = document.createElement("div"); bar.className = "toolbar";
  const st = document.createElement("span"); st.className = "muted"; st.id = "cont-status";
  bar.append(st);
  const ra = document.createElement("button"); ra.className = "btn ghost"; ra.textContent = "Restart all environments";
  ra.title = "Bounce every running environment (to apply the current limits, or to recover a stuck one). In-flight work is interrupted — the affected users are emailed.";
  ra.style.marginLeft = "auto";
  ra.onclick = () => restartAll(ra);
  bar.append(ra);
  c.append(bar);
  const tb = document.createElement("div"); tb.id = "cont-dash-body";
  c.append(tb);
  renderDashboard();
  updateContStatus();
  return c;
}

// renderDashboard — fill #cont-dash-body with the current per-environment
// usage. CPU is a live % of the cap (computed across the 10s polls); RAM +
// disk are usage / cap with a bar.
function renderDashboard() {
  const body = document.getElementById("cont-dash-body");
  if (!body) return;
  body.innerHTML = "";
  if (!CONTAINERS) { // the first fetch is in flight
    body.innerHTML = "<div class='muted' style='display:flex;align-items:center;gap:.5rem;padding:.5rem 0'>" + spinner() + " Querying container environments…</div>";
    return;
  }
  if (!CONTAINERS.runtime_ok) { // the runtime is unavailable (e.g. unprivileged / no backend)
    const detail = CONTAINERS.runtime_detail || "the container runtime is not ready";
    body.innerHTML = "<p class='err'>The container runtime is not ready: " + esc(detail) + "</p>" +
      "<p class='muted'>No environments can run until it is ready, so none are shown as running. The caps below are saved now and apply to every environment once the runtime is available (on Linux that means running bevin as root).</p>";
    return;
  }
  const lim = CONTAINERS.limits || {};
  const cores = lim.cores || 0, memCap = lim.memory_mb || 0, diskCap = lim.disk_mb || 0;
  const list = CONTAINERS.containers || [];
  if (!list.length) { body.append(elP("No environments yet — one is created for each user when they first sign in.")); return; }
  const t = document.createElement("table"); t.className = "q";
  t.innerHTML = "<tr><th>Environment</th><th>State</th><th>CPU</th><th>RAM</th><th>Disk</th></tr>";
  const now = Date.now();
  for (const c of list) {
    // CPU — a live % of the cap (poll delta); "measuring…" on the first poll
    // and right after a restart (the cumulative counter resets).
    let cpuCell;
    if (c.running) {
      const prev = _cpuPrev[c.handle];
      let pct = null;
      if (prev && cores > 0 && c.cpu_seconds >= prev.sec) {
        const dt = (now - prev.ts) / 1000;
        if (dt > 0) pct = Math.max(0, Math.min(100, ((c.cpu_seconds - prev.sec) / dt / cores) * 100));
      }
      _cpuPrev[c.handle] = { sec: c.cpu_seconds, ts: now };
      cpuCell = pct == null ? "<span class='muted'>measuring…</span>" : utilBar(pct) + "<br>" + esc(pct.toFixed(0) + "% of " + cores + " cores");
    } else {
      delete _cpuPrev[c.handle];
      cpuCell = "<span class='muted'>—</span>";
    }
    // RAM — usage / cap (a bar) while running.
    let ramCell = "<span class='muted'>—</span>";
    if (c.running) ramCell = (memCap > 0 ? utilBar(c.ram_mb / memCap * 100) + "<br>" : "") + esc(fmtBytes(c.ram_mb * 1048576) + (memCap > 0 ? " / " + fmtBytes(memCap * 1048576) : " (no cap)"));
    // Disk — usage / cap (a bar); tracked even when stopped.
    let diskCell = "<span class='muted'>—</span>";
    if (c.disk_mb > 0) diskCell = (diskCap > 0 ? utilBar(c.disk_mb / diskCap * 100) + "<br>" : "") + esc(fmtBytes(c.disk_mb * 1048576) + (diskCap > 0 ? " / " + fmtBytes(diskCap * 1048576) : " (no cap)"));
    const state = c.running ? "<span class='badge ok'>running</span>" : "<span class='muted'>" + esc(c.state) + "</span>";
    const tr = document.createElement("tr");
    tr.innerHTML = "<td class='kv'>" + esc(c.handle) + "</td><td>" + state + "</td><td>" + cpuCell + "</td><td>" + ramCell + "</td><td>" + diskCell + "</td>";
    t.append(tr);
  }
  body.append(t);
}

// spinner — a small CSS-animated loading indicator (the .cont-spin style).
function spinner() { return "<span class='cont-spin'></span>"; }
// updateContStatus — the live status line in the environments card: a
// spinner + "querying…" while a fetch is in flight, "updated <time>" once
// the data has landed (so the admin sees it is live + when it last refreshed).
function updateContStatus() {
  const s = document.getElementById("cont-status");
  if (!s) return;
  if (CONTAINERS && CONTAINERS.loaded_at) s.innerHTML = "updated " + new Date(CONTAINERS.loaded_at).toLocaleTimeString();
  else if (_contFetching) s.innerHTML = spinner() + " querying container environments…";
  else s.textContent = "";
}

// utilBar — a usage bar (the shared .util style), 0-100% with a warn/danger
// tint past 70%/90%.
function utilBar(pct) {
  const w = Math.max(0, Math.min(100, pct));
  const cls = w >= 90 ? "danger" : (w >= 70 ? "warn" : "");
  return "<div class='util' style='width:140px'><i class='" + cls + "' style='width:" + w + "%'></i></div>";
}
function fmtBytes(b) {
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + " GiB";
  if (b >= 1048576) return Math.round(b / 1048576) + " MiB";
  if (b >= 1024) return Math.round(b / 1024) + " KiB";
  return Math.round(b) + " B";
}

// renderLimitsCard — the per-container resource caps (moved here from the
// Server page). RAM is a SOFT cap; CPU a quota; disk the per-user storage cap.
function renderLimitsCard() {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = "<h2>Per-container limits</h2>";
  const lim = (CONTAINERS && CONTAINERS.limits) || { cores: 0, memory_mb: 0, disk_mb: 0 };
  const num = (id, label, val, help) => {
    const l = document.createElement("label"); l.textContent = label; c.append(l);
    const i = document.createElement("input"); i.type = "number"; i.min = "0"; i.id = id; i.value = val || 0; c.append(i);
    c.append(elP(help));
    return i;
  };
  num("cont_cores", "CPU cores", lim.cores, "Per-container CPU quota (0 = platform default).");
  num("cont_mem", "Memory (MiB)", lim.memory_mb, "Per-container RAM cap in MiB (0 = platform default). SOFT — the container is never killed on breach.");
  num("cont_disk", "Disk (MiB)", lim.disk_mb, "Per-user disk usage cap in MiB (0 = no cap). Over it, the user is blocked from new work until they clean up back under 90%.");
  c.append(elP("The disk cap applies immediately (the monitor reads it live). Changing CPU or RAM and saving restarts the running environments so they pick up the new caps — their users are emailed that their environment was restarted (in-flight work is interrupted). New environments use the saved limits right away."));
  const sbtn = document.createElement("button"); sbtn.className = "btn"; sbtn.textContent = "Save limits";
  sbtn.onclick = async () => {
    sbtn.disabled = true; sbtn.textContent = "Saving + restarting…";
    try {
      const r = await j("/admin/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sandbox: { cores: parseInt(document.getElementById("cont_cores").value, 10) || 0, memory_mb: parseInt(document.getElementById("cont_mem").value, 10) || 0, disk_mb: parseInt(document.getElementById("cont_disk").value, 10) || 0 } }) });
      const n = (r.restarted || []).length;
      msg(r.reloaded
        ? (n > 0 ? "Saved — " + n + " environment(s) restarted to apply the new limits; their users were emailed." : "Saved. No running environments to restart — new ones use the new limits.")
        : "Saved (the agent reload failed — restart bevin to apply).",
        r.reloaded ? "ok" : "err");
      loadContainers(); // refresh the dashboard (the caps changed)
    } catch (e) {
      msg("Save failed: " + e.message, "err");
    } finally { sbtn.disabled = false; sbtn.textContent = "Save limits"; }
  };
  c.append(sbtn);
  return c;
}

async function restartAll(btn) {
  btn.disabled = true; btn.textContent = "Restarting…";
  try {
    const r = await j("/admin/api/containers/restart", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const n = (r.restarted || []).length;
    msg(n > 0 ? "Restarted " + n + " environment(s) — their users were emailed." : "No running environments to restart.", "ok");
    loadContainers(); // reflect the bounce
  } catch (e) {
    msg("Restart failed: " + e.message, "err");
  } finally { btn.disabled = false; btn.textContent = "Restart all environments"; }
}

function elP(txt) { const p = document.createElement("p"); p.className = "muted"; p.textContent = txt; return p; }

document.getElementById("signout").onclick = async (e) => {
  e.preventDefault();
  try { await j("/logout", { method: "POST" }); } catch (_) {}
  location.href = "/";
};

boot();
</script>
</body>
</html>
